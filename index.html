  // Per change #4 (this round): all activity-log timestamps use the
  // today/full format — "9:14 AM" if today, else "Jun 11 · 9:14 AM".
  function renderActivityRowHtml(h, opts){
    opts = opts || {};
    const t = fmtTodayOrFull(h.changed_at);
    const isInitial = (h.old_status === null || h.old_status === undefined);
    const statusLine = isInitial
      ? '<span class="outreach-activity-text">Added with status <strong>' + escapeHtml(h.new_status) + '</strong></span>'
      : '<span class="outreach-activity-text">Status: <strong>' + escapeHtml(h.old_status) + '</strong> → <strong>' + escapeHtml(h.new_status) + '</strong></span>';
    const editGlyph = h.notes ? '✎' : '+';
    const editTitle = h.notes ? 'Edit note' : 'Add note';

    // If any edits exist for this row, the most-recent note is rendered via
    // the most-recent note-edit event — don't duplicate it on the status row.
    const showInlineNote = !!h.notes && !historyHasEdits(h.id);

    // Per change #3 (this round): only the top (most-recent) activity entry
    // gets a small × delete button.
    const deleteBtn = opts.allowDelete
      ? '<button type="button" class="outreach-activity-delete" data-action="delete-activity" data-event-type="status" data-history-id="' + h.id + '" title="Delete this entry" aria-label="Delete this entry">×</button>'
      : '';

    return '<div class="outreach-activity-row">' +
      '<div class="outreach-activity-main">' +
        statusLine +
        '<span class="outreach-activity-time">' + escapeHtml(t) + '</span>' +
        '<button type="button" class="outreach-activity-edit" data-history-id="' + h.id + '" data-action="edit-note" title="' + editTitle + '">' + editGlyph + '</button>' +
        deleteBtn +
      '</div>' +
      (showInlineNote ? '<div class="outreach-activity-note">' + escapeHtml(h.notes) + '</div>' : '') +
    '</div>';
  }

  function renderNoteEditEventHtml(h, edit, opts){
    opts = opts || {};
    const oldNote = (edit.old_notes == null) ? '' : edit.old_notes;
    const newNote = (edit.new_notes == null) ? '' : edit.new_notes;
    const deleteBtn = opts.allowDelete
      ? '<button type="button" class="outreach-activity-delete" data-action="delete-activity" data-event-type="note-edit" data-edit-id="' + edit.id + '" title="Delete this entry" aria-label="Delete this entry">×</button>'
      : '';
    return '<div class="outreach-activity-row outreach-activity-row-edit">' +
      '<div class="outreach-activity-main">' +
        '<span class="outreach-activity-text">Updated note for status <strong>' + escapeHtml(h.new_status) + '</strong></span>' +
        '<span class="outreach-activity-time">' + escapeHtml(fmtTodayOrFull(edit.edited_at)) + '</span>' +
        deleteBtn +
      '</div>' +
      '<div class="outreach-activity-note-diff">' +
        '<div class="outreach-note-prev"><span class="outreach-note-prev-label">Previous:</span> ' + (oldNote ? '<span class="outreach-note-prev-text">' + escapeHtml(oldNote) + '</span>' : '<span class="outreach-note-empty">—</span>') + '</div>' +
        '<div class="outreach-note-new"><span class="outreach-note-new-label">Updated:</span> ' + (newNote ? '<span>' + escapeHtml(newNote) + '</span>' : '<span class="outreach-note-empty">—</span>') + '</div>' +
      '</div>' +
    '</div>';
  }

  function historyHasEdits(historyId){
    const edits = noteEditsByHistoryId.get(historyId);
    return !!(edits && edits.length > 0);
  }

  function buildActivityEvents(history){
    const events = [];
    for(const h of history){
      events.push({ type: 'status', ts: h.changed_at, h: h });
      const edits = noteEditsByHistoryId.get(h.id) || [];
      // Per change #6: emit one event per edit, never collapse.
      for(const e of edits){
        events.push({ type: 'note-edit', ts: e.edited_at, h: h, edit: e });
      }
    }
    events.sort(function(a, b){ return new Date(b.ts) - new Date(a.ts); });
    return events;
  }

  function renderActivityLogHtml(history, lead){
    if(!history || history.length === 0){
      return '<div class="outreach-activity" data-noexpand="1">' +
        '<div class="outreach-detail-label">activity</div>' +
        '<div class="outreach-activity-empty">No activity yet</div>' +
      '</div>';
    }
    const events = buildActivityEvents(history);
    // Per change #3: only the top (most-recent) event gets a × delete button.
    // Per this round: don't show × at all when it's the only entry — there
    // must always be at least one activity entry left on a lead.
    const renderEvent = function(ev, idx){
      const opts = { allowDelete: idx === 0 && events.length > 1 };
      if(ev.type === 'note-edit') return renderNoteEditEventHtml(ev.h, ev.edit, opts);
      return renderActivityRowHtml(ev.h, opts);
    };

    // Per change #2 + #7: if every event fits in the collapsed view, render
    // no fade/toggle at all and no height cap. Otherwise render the first
    // N events with a fade gradient and a prominent Expand button.
    if(events.length <= ACTIVITY_VISIBLE_COUNT){
      return '<div class="outreach-activity" data-noexpand="1">' +
        '<div class="outreach-detail-label">activity</div>' +
        '<div class="outreach-activity-list">' + events.map(renderEvent).join('') + '</div>' +
      '</div>';
    }

    if(activityExpanded){
      return '<div class="outreach-activity" data-noexpand="1">' +
        '<div class="outreach-detail-label">activity</div>' +
        '<div class="outreach-activity-list">' + events.map(renderEvent).join('') + '</div>' +
        '<div class="outreach-activity-toggle-wrap">' +
          '<button type="button" class="outreach-activity-toggle-btn" data-action="toggle-activity">Collapse</button>' +
        '</div>' +
      '</div>';
    }

    const visibleHtml = events.slice(0, ACTIVITY_VISIBLE_COUNT).map(renderEvent).join('');
    const hiddenCount = events.length - ACTIVITY_VISIBLE_COUNT;
    return '<div class="outreach-activity" data-noexpand="1">' +
      '<div class="outreach-detail-label">activity</div>' +
      '<div class="outreach-activity-list outreach-activity-list-collapsed">' +
        visibleHtml +
        '<div class="outreach-activity-fade"></div>' +
      '</div>' +
      '<div class="outreach-activity-toggle-wrap">' +
        '<button type="button" class="outreach-activity-toggle-btn" data-action="toggle-activity">Expand · ' + hiddenCount + ' more</button>' +
      '</div>' +
    '</div>';
  }

  // EVENTS
  async function commitPendingNote(noteValue){
    if(!pendingNote) return;
    const pn = pendingNote;
    pendingNote = null;
    try {
      if(pn.kind === 'create'){
        if(noteValue){
          await setHistoryNoteInitial(pn.historyId, noteValue);
        }
      } else if(pn.kind === 'change'){
        const lead = leads.find(function(l){ return l.id === pn.leadId; });
        if(!lead){ render(); return; }
        await changeStatusWithNote(lead, pn.newStatus, noteValue);
        await loadLeads();
      } else if(pn.kind === 'note-edit'){
        // Per change #6: every edit logs a new outreach_note_edits row.
        const oldNotes = pn.currentNote || '';
        await createNoteEdit(pn.historyId, oldNotes, noteValue);
        await loadAllNoteEdits();
      }
      await loadAllHistories();
      render();
    } catch(e){
      alert('Error: ' + errMsg(e));
      render();
    }
  }

  function cancelPendingNote(){
    // Used by Cancel in the note-edit overlay's note stage (and any other
    // flow where Skip should NOT commit anything).
    pendingNote = null;
    render();
  }

  // ----- IN-PLACE DROPDOWN UPDATES (no full re-render) -----
  // Build the menu HTML for a dropdown without rebuilding its trigger or
  // surrounding DOM. Used when opening a dropdown in place.
  function buildMenuHtmlForDropdown(ddId){
    if(ddId === 'filter'){
      const allColor = '#9aa2af';
      const opts = [{ value: 'all', label: 'All statuses', color: allColor }]
        .concat(statuses.map(function(s){ return { value: s.label, label: s.label, color: s.color || '#4D89FF' }; }));
      return '<div class="outreach-cdrop-menu">' +
        opts.map(function(o){
          const selected = (currentFilter === o.value);
          return '<button type="button" class="outreach-cdrop-option' + (selected ? ' selected' : '') + '" ' +
            'data-action="filter-select" data-value="' + escapeHtml(o.value) + '">' +
            dotSvg(o.color) + '<span class="outreach-cdrop-option-label">' + escapeHtml(o.label) + '</span>' +
          '</button>';
        }).join('') +
      '</div>';
    }
    if(ddId === 'header-sort'){
      return '<div class="outreach-cdrop-menu outreach-cdrop-menu-sort">' +
        HEADER_SORT_OPTIONS.map(function(o){
          const selected = (currentSort === o.value);
          return '<button type="button" class="outreach-cdrop-option' + (selected ? ' selected' : '') + '" ' +
            'data-action="sort-select" data-value="' + escapeHtml(o.value) + '">' +
            '<span class="outreach-cdrop-option-label">' + escapeHtml(o.label) + '</span>' +
          '</button>';
        }).join('') +
      '</div>';
    }
    if(ddId === 'add-lead-status'){
      const selected = newLeadStatus || (statuses[0] && statuses[0].label) || '';
      return '<div class="outreach-cdrop-menu">' +
        statuses.map(function(s){
          const c = s.color || '#4D89FF';
          const isSel = s.label === selected;
          return '<button type="button" class="outreach-cdrop-option' + (isSel ? ' selected' : '') + '" ' +
            'data-action="new-lead-status-select" data-value="' + escapeHtml(s.label) + '">' +
            dotSvg(c) + '<span class="outreach-cdrop-option-label">' + escapeHtml(s.label) + '</span>' +
          '</button>';
        }).join('') +
      '</div>';
    }
    if(ddId && ddId.indexOf('lead-') === 0){
      const leadId = ddId.slice(5);
      const lead = leads.find(function(l){ return l.id === leadId; });
      if(!lead) return '';
      return '<div class="outreach-cdrop-menu">' +
        statuses.map(function(s){
          const c = s.color || '#4D89FF';
          const isSel = s.label === lead.status;
          return '<button type="button" class="outreach-cdrop-option' + (isSel ? ' selected' : '') + '" ' +
            'data-action="status-select" data-lead-id="' + lead.id + '" data-value="' + escapeHtml(s.label) + '">' +
            dotSvg(c) + '<span class="outreach-cdrop-option-label">' + escapeHtml(s.label) + '</span>' +
          '</button>';
        }).join('') +
      '</div>';
    }
    return '';
  }

  // Sync every `.outreach-cdrop` in the DOM with `openDropdownId`. Only the
  // affected dropdown's children are touched — the surrounding row / overlay /
  // tracker frame is left untouched, so no flash.
  function applyDropdownStateInPlace(){
    document.querySelectorAll('.outreach-cdrop').forEach(function(cdrop){
      const ddId = cdrop.dataset.dropdownId;
      const shouldOpen = openDropdownId === ddId;
      const isOpen = cdrop.classList.contains('open');
      if(shouldOpen && !isOpen){
        cdrop.classList.add('open');
        const menuHtml = buildMenuHtmlForDropdown(ddId);
        if(menuHtml){
          cdrop.insertAdjacentHTML('beforeend', menuHtml);
          const menu = cdrop.querySelector('.outreach-cdrop-menu');
          if(menu) menu.addEventListener('click', handleDynamicMenuClick);
        }
      } else if(!shouldOpen && isOpen){
        cdrop.classList.remove('open');
        const menu = cdrop.querySelector('.outreach-cdrop-menu');
        if(menu) menu.remove();
      }
    });
  }

  // Delegated click handler bound directly on dynamically-injected menus so
  // their options work without relying on attachTrackerListeners (which only
  // runs after a full render).
  function handleDynamicMenuClick(e){
    const opt = e.target.closest('[data-action]');
    if(!opt) return;
    if(opt.dataset.action === 'dropdown-toggle') return;
    e.stopPropagation();
    const action = opt.dataset.action;
    if(action === 'filter-select'){
      currentFilter = opt.dataset.value;
      openDropdownId = null;
      render();
    } else if(action === 'sort-select'){
      currentSort = opt.dataset.value;
      openDropdownId = null;
      render();
    } else if(action === 'status-select'){
      const leadId = opt.dataset.leadId;
      const newStatus = opt.dataset.value;
      const lead = leads.find(function(l){ return l.id === leadId; });
      openDropdownId = null;
      if(!lead || newStatus === lead.status){ applyDropdownStateInPlace(); return; }
      pendingNote = {
        kind: 'change',
        stage: 'confirm',
        leadId: lead.id,
        leadName: lead.name,
        oldStatus: lead.status,
        newStatus: newStatus
      };
      render();
    } else if(action === 'new-lead-status-select'){
      // Per change #2 (this round): update the trigger in place, then close
      // the menu. The overlay must NOT be rebuilt — form fields stay intact.
      newLeadStatus = opt.dataset.value;
      openDropdownId = null;
      updateAddLeadTriggerInPlace();
      applyDropdownStateInPlace();
    }
  }

  // Update the Add Lead status trigger's label + dot color in place (no
  // overlay rebuild).
  function updateAddLeadTriggerInPlace(){
    const cdrop = document.querySelector('.outreach-cdrop[data-dropdown-id="add-lead-status"]');
    if(!cdrop) return;
    const selected = newLeadStatus || (statuses[0] && statuses[0].label) || '';
    const color = selected ? statusColor(selected) : '#9aa2af';
    const labelEl = cdrop.querySelector('.outreach-cdrop-label');
    const dotEl   = cdrop.querySelector('.outreach-cdrop-dot');
    if(labelEl) labelEl.textContent = selected;
    if(dotEl)   dotEl.style.background = color;
  }

  function attachTrackerListeners(){
    // Custom dropdown — toggle open / close in place (no full re-render).
    document.querySelectorAll('[data-action="dropdown-toggle"]').forEach(function(trig){
      trig.addEventListener('click', function(e){
        e.stopPropagation();
        const id = trig.dataset.dropdownId;
        openDropdownId = (openDropdownId === id) ? null : id;
        applyDropdownStateInPlace();
      });
    });
    // Bind the delegated menu click handler on any statically-rendered menus
    // (i.e. dropdowns rendered with isOpen=true via the existing renderers).
    // Dynamically-injected menus bind the same handler in applyDropdownStateInPlace.
    document.querySelectorAll('.outreach-cdrop-menu').forEach(function(menu){
      menu.addEventListener('click', handleDynamicMenuClick);
    });

    // Rating column header — click toggles between rating-desc and rating-asc.
    // If currently on another sort, first click goes to rating-desc.
    document.querySelectorAll('[data-action="cycle-rating-sort"]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        if(currentSort === 'rating-desc') currentSort = 'rating-asc';
        else if(currentSort === 'rating-asc') currentSort = 'rating-desc';
        else currentSort = 'rating-desc';
        render();
      });
    });

    const addBtn = document.getElementById('add-lead-btn');
    if(addBtn) addBtn.addEventListener('click', function(){
      showingAddForm = !showingAddForm;
      // Reset the selected status to the first available whenever the overlay
      // opens — so the dropdown always has a valid default. Rating starts
      // unset so the user must explicitly pick one.
      if(showingAddForm){
        newLeadStatus = (statuses[0] && statuses[0].label) || null;
        newLeadRating = null;
      } else {
        newLeadStatus = null;
        newLeadRating = null;
      }
      render();
    });

    const toggleStatusBtn = document.getElementById('toggle-status-manager');
    if(toggleStatusBtn) toggleStatusBtn.addEventListener('click', function(){
      showingStatusManager = true;
      render();
    });

    // Toolbar search — filters in real time, preserves input focus + caret
    // position across the re-render that follows each keystroke.
    const searchInput = document.getElementById('outreach-search-input');
    if(searchInput){
      searchInput.addEventListener('input', function(){
        searchQuery = searchInput.value;
        const selStart = searchInput.selectionStart;
        const selEnd   = searchInput.selectionEnd;
        render();
        const newInput = document.getElementById('outreach-search-input');
        if(newInput){
          newInput.focus();
          try { newInput.setSelectionRange(selStart, selEnd); } catch(_){}
        }
      });
    }
    const searchClearBtn = document.getElementById('outreach-search-clear');
    if(searchClearBtn) searchClearBtn.addEventListener('click', function(){
      searchQuery = '';
      render();
      const newInput = document.getElementById('outreach-search-input');
      if(newInput) newInput.focus();
    });

    // Manage Statuses overlay — close via × button or backdrop click
    const statusOverlayClose = document.getElementById('status-overlay-close');
    if(statusOverlayClose) statusOverlayClose.addEventListener('click', function(){
      showingStatusManager = false;
      render();
    });
    document.querySelectorAll('[data-action="overlay-dismiss-status"]').forEach(function(ov){
      ov.addEventListener('click', function(e){
        if(e.target !== ov) return;
        showingStatusManager = false;
        render();
      });
    });

    // Add Lead overlay — close via × button or backdrop click
    const addLeadClose = document.getElementById('add-lead-close');
    if(addLeadClose) addLeadClose.addEventListener('click', function(){
      showingAddForm = false;
      newLeadStatus = null;
      newLeadRating = null;
      render();
    });
    document.querySelectorAll('[data-action="overlay-dismiss-add"]').forEach(function(ov){
      ov.addEventListener('click', function(e){
        if(e.target !== ov) return;
        showingAddForm = false;
        newLeadStatus = null;
        newLeadRating = null;
        render();
      });
    });

    // Add Lead status dropdown options are bound via the delegated
    // handleDynamicMenuClick handler (no static binding needed).

    // Add Lead form — gather field values for validation + save.
    function readAddLeadFields(){
      const nameEl = document.getElementById('lead-name');
      const urlEl  = document.getElementById('lead-url');
      const noteEl = document.getElementById('lead-note');
      return {
        name:   nameEl ? nameEl.value.trim() : '',
        url:    urlEl  ? urlEl.value.trim()  : '',
        status: newLeadStatus || '',
        rating: newLeadRating,
        note:   noteEl ? noteEl.value.trim() : ''
      };
    }
    function isAddLeadValid(){
      const f = readAddLeadFields();
      return !!f.name && !!f.url && !!f.status &&
             (f.rating === 1 || f.rating === 2 || f.rating === 3) &&
             !!f.note;
    }
    function updateAddLeadFormStateInPlace(){
      // Toggle the Save button's disabled attribute in place.
      const btn = document.getElementById('form-save');
      if(btn) btn.disabled = !isAddLeadValid();
    }
    function markAddLeadInvalidFields(){
      // Show inline indicators on whichever required fields are still empty.
      const f = readAddLeadFields();
      const nameEl = document.getElementById('lead-name');
      const urlEl  = document.getElementById('lead-url');
      const noteEl = document.getElementById('lead-note');
      const ratingWrap = document.getElementById('new-lead-rating');
      if(nameEl) nameEl.classList.toggle('invalid', !f.name);
      if(urlEl)  urlEl.classList.toggle('invalid',  !f.url);
      if(noteEl) noteEl.classList.toggle('invalid', !f.note);
      if(ratingWrap) ratingWrap.classList.toggle('invalid',
        !(f.rating === 1 || f.rating === 2 || f.rating === 3));
    }

    // Live disable Save while the user types / picks options.
    ['lead-name', 'lead-url', 'lead-note'].forEach(function(id){
      const el = document.getElementById(id);
      if(!el) return;
      el.addEventListener('input', function(){
        // Clear the invalid mark on this field as soon as it has content.
        if(el.value.trim()) el.classList.remove('invalid');
        updateAddLeadFormStateInPlace();
      });
    });

    // Star handler for the Add Lead form rating field.
    document.querySelectorAll('[data-action="rate-new-lead"]').forEach(function(starBtn){
      starBtn.addEventListener('click', function(e){
        e.stopPropagation();
        e.preventDefault();
        const clicked = parseInt(starBtn.dataset.rating, 10) || 0;
        // Click the current highest filled star → clear (same UX as table).
        newLeadRating = (newLeadRating === clicked) ? null : clicked;
        const wrap = document.getElementById('new-lead-rating');
        if(wrap){
          wrap.querySelectorAll('.outreach-star').forEach(function(b){
            const idx = parseInt(b.dataset.rating, 10);
            if(newLeadRating != null && idx <= newLeadRating) b.classList.add('filled');
            else b.classList.remove('filled');
          });
          if(newLeadRating != null) wrap.classList.remove('invalid');
        }
        updateAddLeadFormStateInPlace();
      });
    });

    const saveBtn = document.getElementById('form-save');
    if(saveBtn) saveBtn.addEventListener('click', async function(){
      // Defensive: button should already be disabled while invalid, but
      // mark fields anyway if somehow reached without a valid form.
      if(!isAddLeadValid()){
        markAddLeadInvalidFields();
        return;
      }
      const f = readAddLeadFields();
      saveBtn.disabled = true;
      try {
        await createLead({
          name: f.name,
          profile_url: f.url,
          status: f.status,
          rating: f.rating,
          notes: f.note
        });
        showingAddForm = false;
        newLeadStatus = null;
        newLeadRating = null;
        await loadLeads();
        await loadAllHistories();
        // Per change #1 (this round): no post-save note prompt — the note
        // was already saved into the initial history row by createLead.
        render();
      } catch(e){
        alert('Error: ' + errMsg(e));
        saveBtn.disabled = false;
      }
    });
    const cancelBtn = document.getElementById('form-cancel');
    if(cancelBtn) cancelBtn.addEventListener('click', function(){
      showingAddForm = false;
      newLeadStatus = null;
      newLeadRating = null;
      render();
    });

    // Overlay — status-change confirmation step
    const confirmCancelBtn = document.getElementById('confirm-cancel');
    if(confirmCancelBtn) confirmCancelBtn.addEventListener('click', function(){
      pendingNote = null;
      render();
    });
    const confirmYesBtn = document.getElementById('confirm-yes');
    if(confirmYesBtn) confirmYesBtn.addEventListener('click', function(){
      if(pendingNote) pendingNote.stage = 'note';
      render();
    });

    // Overlay — note prompt Save (always required) + Cancel (note-edit only)
    const noteInput = document.getElementById('note-prompt-input');
    const noteSaveBtn = document.getElementById('note-prompt-save');
    if(noteInput && noteSaveBtn){
      // Live-disable Save until the textarea has non-whitespace text.
      const sync = function(){
        const v = noteInput.value || '';
        const valid = /\S/.test(v);
        noteSaveBtn.disabled = !valid;
        if(valid) noteInput.classList.remove('invalid');
      };
      noteInput.addEventListener('input', sync);
    }
    if(noteSaveBtn) noteSaveBtn.addEventListener('click', async function(){
      const input = document.getElementById('note-prompt-input');
      const note = input ? input.value.trim() : '';
      // Defensive: button should be disabled while empty.
      if(!note){
        if(input) input.classList.add('invalid');
        return;
      }
      await commitPendingNote(note);
    });
    // Cancel is only rendered for the note-edit kind — dismiss without saving.
    const noteSkipBtn = document.getElementById('note-prompt-skip');
    if(noteSkipBtn) noteSkipBtn.addEventListener('click', function(){
      cancelPendingNote();
    });

    document.querySelectorAll('.outreach-row').forEach(function(row){
      const id = row.dataset.leadId;
      const lead = leads.find(function(l){ return l.id === id; });
      if(!lead) return;

      row.addEventListener('click', function(e){
        if(e.target.closest('[data-action]')) return;
        if(e.target.closest('[data-noexpand]')) return;
        if(e.target.closest('a')) return;
        if(e.target.closest('input, textarea, select, button')) return;
        if(row.classList.contains('outreach-row-expanded')){
          // Dead-space click on an expanded row collapses it (change #4)
          expandedLeadId = null;
          editingLeadId = null;
          editingNoteHistoryId = null;
          activityExpanded = false;
          render();
        } else {
          expandedLeadId = id;
          activityExpanded = false;
          render();
        }
      });

      row.querySelectorAll('[data-action]').forEach(function(btn){
        btn.addEventListener('click', async function(e){
          e.stopPropagation();
          const action = btn.dataset.action;
          if(action === 'copy-url'){
            const url = btn.dataset.url || '';
            try {
              await navigator.clipboard.writeText(url);
              const orig = btn.innerHTML;
              btn.classList.add('copied');
              btn.innerHTML = '<span class="outreach-copy-check">✓</span>';
              setTimeout(function(){
                btn.classList.remove('copied');
                btn.innerHTML = orig;
              }, 1200);
            } catch(_){}
          } else if(action === 'rate-lead'){
            // Per spec: click a star to set rating; click the current highest
            // filled star to clear. Update the model + DOM in place — no full
            // re-render so the row doesn't flash.
            const clicked = parseInt(btn.dataset.rating, 10) || 0;
            const target = (lead.rating === clicked) ? null : clicked;
            lead.rating = target;
            // Update the star buttons inside this row's rating cell.
            const ratingWrap = row.querySelector('.outreach-rating');
            if(ratingWrap){
              ratingWrap.querySelectorAll('.outreach-star').forEach(function(starBtn){
                const idx = parseInt(starBtn.dataset.rating, 10);
                if(target != null && idx <= target) starBtn.classList.add('filled');
                else starBtn.classList.remove('filled');
              });
            }
            try {
              await updateLeadRating(lead.id, target);
            } catch(err){
              alert('Error: ' + errMsg(err));
              // Reload to reconcile with whatever the cloud actually has.
              await loadLeads(); render();
            }
          } else if(action === 'collapse'){
            expandedLeadId = null; editingLeadId = null; editingNoteHistoryId = null; activityExpanded = false; render();
          } else if(action === 'edit'){
            editingLeadId = id; render();
          } else if(action === 'cancel-edit'){
            editingLeadId = null; render();
          } else if(action === 'save-edit'){
            const name = document.getElementById('edit-name-' + id).value.trim();
            const url = document.getElementById('edit-url-' + id).value.trim();
            if(!name){ alert('Name is required'); return; }
            try {
              await updateLeadFields(id, {
                name: name,
                profile_url: url || null
              });
              editingLeadId = null;
              await loadLeads();
              render();
            } catch(err){ alert('Error: ' + errMsg(err)); }
          } else if(action === 'delete'){
            if(!confirm('Delete ' + lead.name + '? This cannot be undone.')) return;
            try {
              await deleteLead(id);
              expandedLeadId = null;
              await loadLeads();
              await loadAllHistories();
              render();
            } catch(err){ alert('Error: ' + errMsg(err)); }
          } else if(action === 'edit-note'){
            // Per change #6 (this round): skip the confirm overlay entirely
            // and go straight to the note edit prompt with the existing note
            // pre-filled. Save IS the confirmation.
            const histId = btn.dataset.historyId;
            const histList = leadHistories.get(id) || [];
            const histRow = histList.find(function(h){ return h.id === histId; });
            if(!histRow) return;
            // The "current note" is the most recent value — which lives in
            // the last outreach_note_edits row if any exist, otherwise on the
            // history row itself.
            const edits = noteEditsByHistoryId.get(histId) || [];
            const currentNote = edits.length
              ? (edits[edits.length - 1].new_notes || '')
              : (histRow.notes || '');
            pendingNote = {
              kind: 'note-edit',
              stage: 'note',
              leadId: id,
              leadName: lead.name,
              historyId: histId,
              statusLabel: histRow.new_status,
              currentNote: currentNote
            };
            render();
          } else if(action === 'toggle-activity'){
            activityExpanded = !activityExpanded;
            render();
          } else if(action === 'delete-activity'){
            // Per change #3: × on the most-recent activity entry deletes it.
            // The × button isn't rendered at all when it would leave the lead
            // with zero activity entries, so we no longer warn about that.
            const evType = btn.dataset.eventType;
            if(evType === 'status'){
              if(!confirm('Delete this activity entry?')) return;
              try {
                await deleteHistoryRow(btn.dataset.historyId, id);
                await loadLeads();
                await loadAllHistories();
                await loadAllNoteEdits();
                render();
              } catch(err){ alert('Error: ' + errMsg(err)); }
            } else if(evType === 'note-edit'){
              if(!confirm('Delete this note edit?')) return;
              try {
                await deleteNoteEditRow(btn.dataset.editId);
                // Reload histories too — the parent row's `notes` was just
                // reverted, and the activity log reads from leadHistories.
                await loadAllHistories();
                await loadAllNoteEdits();
                render();
              } catch(err){ alert('Error: ' + errMsg(err)); }
            }
          }
        });
      });
    });

    const addStatusBtn = document.getElementById('add-status-btn');
    if(addStatusBtn) addStatusBtn.addEventListener('click', async function(){
      const label = document.getElementById('new-status-label').value.trim();
      const color = document.getElementById('new-status-color').value;
      if(!label) return;
      try {
        await createStatus({ label: label, color: color });
        await loadStatuses();
        render();
      } catch(e){ alert('Error: ' + errMsg(e)); }
    });

    document.querySelectorAll('.outreach-status-delete').forEach(function(btn){
      btn.addEventListener('click', async function(){
        if(btn.disabled) return;
        const id = btn.dataset.statusId;
        const status = statuses.find(function(s){ return s.id === id; });
        if(!status) return;
        if(!confirm('Delete status "' + status.label + '"?')) return;
        try {
          await deleteStatusById(id);
          await loadStatuses();
          render();
        } catch(e){ alert('Error: ' + errMsg(e)); }
      });
    });

    const disconnectBtn = document.getElementById('disconnect-btn');
    if(disconnectBtn) disconnectBtn.addEventListener('click', function(){
      if(!confirm('Disconnect from Supabase?')) return;
      clearCreds();
      supabaseClient = null;
      leads = []; statuses = []; leadHistories.clear();
      expandedLeadId = null; editingLeadId = null; showingAddForm = false;
      phase = 'no-creds';
      render();
    });
  }

  // GLOBAL — close any open custom dropdown when a click lands outside it.
  // Per change #1/#2 (this round): close in place so the surrounding row /
  // overlay doesn't flash.
  document.addEventListener('click', function(e){
    if(!openDropdownId) return;
    if(e.target.closest('.outreach-cdrop[data-dropdown-id="' + openDropdownId + '"]')) return;
    openDropdownId = null;
    if(phase === 'ready') applyDropdownStateInPlace();
  });

  // BOOT
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
