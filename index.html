<script>
(function(){'use strict';
// CONFIG
const START_DATE = new Date(2026, 4, 18);
const TOTAL_DAYS = 75;
const STORAGE_KEY = '75aaron_v1';
const REVENUE_KEY = '75aaron_revenue';
const REVENUE_GOAL = 100000;
const EXCEPTIONS = new Set(['2026-05-22','2026-06-27','2026-06-28','2026-06-29','2026-06-30','2026-07-01','2026-07-02','2026-07-03','2026-07-04','2026-07-11']);

const HABITS = {
  outreach: { id:'outreach', label:'Outreach', cat:'work', kind:'timed', floor:30, full:60, floorLabel:'30m', fullLabel:'1h' },
  study:    { id:'study',    label:'Growth Ops Study', cat:'work', kind:'timed', floor:60, full:120, floorLabel:'1h', fullLabel:'2h' },
  creator:  { id:'creator',  label:'Creator Work', cat:'work', kind:'timed', floor:120, full:300, floorLabel:'2h', fullLabel:'5h' },
  // Day 25+ work habits
  hours_worked:   { id:'hours_worked',   label:'Hours Worked', cat:'work', kind:'timed', full:480, fullLabel:'8h' },
  outreach_looms: { id:'outreach_looms', label:'Funnel Hacks', cat:'work', kind:'count', target:3 },
  reel_1:         { id:'reel_1',         label:'1 Reel', cat:'work', kind:'binary' },
  trial_reels_5:  { id:'trial_reels_5',  label:'5 Trial Reels', cat:'work', kind:'binary' },
  walk:     { id:'walk',     label:'20 min walk', cat:'body', kind:'binary' },          // days 1–10 only
  steps:    { id:'steps',    label:'7500 steps', cat:'body', kind:'binary' },           // day 11+
  protein:  { id:'protein',  label:'180g protein', cat:'body', kind:'protein', target:180 }, // days 1–10 only
  fast:     { id:'fast',     label:'Fast until noon', cat:'body', kind:'binary' },      // day 11+
  lift:     { id:'lift',     label:'Lift', cat:'body', kind:'binary', liftOnly:true },
  weight:   { id:'weight',   label:'Log Weight', cat:'body', kind:'weight', todayOnward:true }, // today + future days only
  sleep:    { id:'sleep',    label:'Wake up at 8am', cat:'discipline', kind:'sleep' },
  clean_diet:   { id:'clean_diet',   label:'No sugar, seed oils', cat:'discipline', kind:'binary' },
  sober:        { id:'sober',        label:'No weed, liquor, nicotine', cat:'discipline', kind:'binary' },
};
const ORDER = {
  work: ['outreach','study','creator'],
  body: ['walk','protein','lift','weight'],
  discipline: ['sleep','clean_diet','sober'],
};
const CATEGORIES = [{id:'work',label:'Work'},{id:'body',label:'Body'},{id:'discipline',label:'Discipline'}];
const DRAWER_KINDS = new Set(['timed','protein','sleep','count']);
const DAYS_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

// HELPERS
function pad(n){ return String(n).padStart(2,'0'); }
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function addDays(d,n){ const r=new Date(d.getFullYear(),d.getMonth(),d.getDate()); r.setDate(r.getDate()+n); return r; }
function startOfLocalDay(d){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
function dayIndexFromDate(d){ return Math.round((startOfLocalDay(d).getTime()-startOfLocalDay(START_DATE).getTime())/86400000); }
function dateForDayIndex(i){ return addDays(START_DATE,i); }
function isLiftDay(i){ return (i % 2) === 0; }
function formatDate(d){ return DAYS_SHORT[d.getDay()]+' '+MONTHS_SHORT[d.getMonth()]+' '+d.getDate(); }
function formatTime(ts){ const d=new Date(ts); let h=d.getHours(); const m=d.getMinutes(); const ap=h>=12?'PM':'AM'; h=h%12; if(h===0) h=12; return h+':'+pad(m)+' '+ap; }
function fmtMin(m){ m=Math.round(m); if(m<60) return m+'m'; const h=Math.floor(m/60), r=m%60; return r===0?h+'h':h+'h '+r+'m'; }
function genId(){ return Math.random().toString(36).slice(2,11); }

// STATE
let state = loadState();
let viewingDayIdx = null;
let openDrawers = new Set();
let renderedOnce = false;
// Set to a day key (YYYY-MM-DD) while the weight habit's inline input is open
// for that day. Reset to null when the input commits, cancels, or the user
// navigates to a different day.
let weightEditingKey = null;

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const p = JSON.parse(raw);
      if(p && typeof p==='object' && p.days){ migrate(p); return p; }
    }
  }catch(e){}
  return { version:4, days:{} };
}
// saveState(dayKey?) — always writes localStorage; if dayKey is passed,
// also fires off an upsert to Supabase for that day (silent on failure).
function saveState(dayKey){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  if(dayKey){ cloudUpsertHabitDay(dayKey); }
}

// REVENUE — stored separately under 75aaron_revenue, never touches 75aaron_v1.
let revenueState = loadRevenueState();
function loadRevenueState(){
  try{
    const raw = localStorage.getItem(REVENUE_KEY);
    if(raw){
      const p = JSON.parse(raw);
      if(p && typeof p === 'object' && p.days) return p;
    }
  }catch(e){}
  return { version:1, days:{} };
}
function saveRevenueState(){ try{ localStorage.setItem(REVENUE_KEY, JSON.stringify(revenueState)); }catch(e){} }

function revenueEntries(key){
  if(!revenueState.days[key]) revenueState.days[key] = [];
  return revenueState.days[key];
}
function dayRevenueTotal(key){
  const entries = revenueState.days[key] || [];
  let t = 0;
  for(const e of entries) t += (e.amount || 0);
  return t;
}
function totalRevenue(){
  let t = 0;
  for(const key of Object.keys(revenueState.days || {})){
    t += dayRevenueTotal(key);
  }
  return t;
}
function addRevenueEntry(description, amount){
  const key = ymd(dateForDayIndex(viewingDayIdx));
  const list = revenueEntries(key);
  const entry = { id: genId(), description: description || '', amount: amount, timestamp: Date.now() };
  list.push(entry);
  saveRevenueState();
  render();
  // Push to cloud; if Supabase assigns its own UUID, swap our local id so
  // future deletes target the right row.
  cloudInsertRevenueEntry(key, entry).then(function(cloudId){
    if(cloudId && cloudId !== entry.id){
      entry.id = cloudId;
      saveRevenueState();
    }
  });
}
function deleteRevenueEntry(entryId){
  const key = ymd(dateForDayIndex(viewingDayIdx));
  const list = revenueState.days[key];
  if(!list) return;
  revenueState.days[key] = list.filter(e => e.id !== entryId);
  saveRevenueState();
  render();
  cloudDeleteRevenueEntry(entryId);
}
function formatMoney(n){
  if(!isFinite(n) || n < 0) n = 0;
  const rounded = Math.round(n * 100) / 100;
  if(rounded === Math.floor(rounded)){
    return '$' + Math.floor(rounded).toLocaleString('en-US');
  }
  return '$' + rounded.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function migrate(s){
  if(!s.version) s.version = 1;
  if(s.version < 2){
    const drawerIds = ['outreach','study','creator','protein'];
    const oldBinaryIds = ['walk','lift','sleep','no_sugar','no_seed_oils','no_weed','no_nicotine','no_alcohol'];
    for(const key of Object.keys(s.days||{})){
      const day = s.days[key];
      const oh = day.habits || {};
      const om = day.measurements || {};
      const nh = {};
      const parts = key.split('-').map(Number);
      const baseTs = new Date(parts[0], parts[1]-1, parts[2], 12, 0, 0).getTime();
      for(const id of drawerIds){
        const logs = [];
        const m = om[id];
        const old = oh[id];
        if(m && m > 0){
          if(id === 'protein') logs.push({ id:genId(), label:'imported', grams:Math.round(m), timestamp:baseTs });
          else logs.push({ id:genId(), amount:Math.round(m), timestamp:baseTs });
        }
        const fc = old === 'full' || old === 'floor' || old === true;
        nh[id] = { logs, forceComplete:fc };
      }
      for(const id of oldBinaryIds){ nh[id] = oh[id] === true; }
      day.habits = nh;
      delete day.measurements;
    }
    s.version = 2;
  }
  if(s.version < 3){
    // Combine: no_weed + no_nicotine + no_alcohol → sober; no_sugar + no_seed_oils → clean_diet
    for(const key of Object.keys(s.days||{})){
      const day = s.days[key];
      if(!day.habits) continue;
      const oh = day.habits;
      oh.sober = (oh.no_weed === true) && (oh.no_nicotine === true) && (oh.no_alcohol === true);
      oh.clean_diet = (oh.no_sugar === true) && (oh.no_seed_oils === true);
      delete oh.no_sugar;
      delete oh.no_seed_oils;
      delete oh.no_weed;
      delete oh.no_nicotine;
      delete oh.no_alcohol;
    }
    s.version = 3;
  }
  if(s.version < 4){
    // Sleep: boolean → { done, logs:[] }
    for(const key of Object.keys(s.days||{})){
      const day = s.days[key];
      if(!day.habits) continue;
      const oh = day.habits;
      if(typeof oh.sleep !== 'object' || oh.sleep === null){
        const wasDone = oh.sleep === true;
        oh.sleep = { done: wasDone, logs: [] };
      }
    }
    s.version = 4;
  }
}

function getDay(key){
  if(!state.days[key]) state.days[key] = { floorMode:false, habits:{} };
  const d = state.days[key];
  if(!d.habits) d.habits = {};
  for(const id of ['outreach','study','creator','protein','hours_worked','outreach_looms']){
    if(!d.habits[id] || typeof d.habits[id] !== 'object') d.habits[id] = { logs:[], forceComplete:false };
    if(!Array.isArray(d.habits[id].logs)) d.habits[id].logs = [];
  }
  // Sleep: binary "woke up at 8am" + optional sleep-hours logs.
  if(typeof d.habits.sleep !== 'object' || d.habits.sleep === null){
    const wasDone = d.habits.sleep === true;
    d.habits.sleep = { done: wasDone, logs: [] };
  }
  if(!Array.isArray(d.habits.sleep.logs)) d.habits.sleep.logs = [];
  if(typeof d.habits.sleep.done !== 'boolean') d.habits.sleep.done = false;
  // Weight: { lbs: number|null }. Seeded lazily so old days don't get the slot
  // unless they're touched.
  if(d.habits.weight && (typeof d.habits.weight !== 'object' || Array.isArray(d.habits.weight))){
    d.habits.weight = { lbs: null };
  }
  return d;
}

// Day-index-based habit swaps.
//   Day 11+ (index ≥ 10): walk→steps, protein→fast
//   Day 25+ (index ≥ 24): work category fully replaced — outreach/study/creator → hours_worked + outreach_looms + 1 Reel + 5 Trial Reels
// Days before each cutoff keep the originals so existing logged data renders intact.
function resolveHabitId(id, dayIdx){
  if(dayIdx >= 10){
    if(id === 'walk')    return 'steps';
    if(id === 'protein') return 'fast';
  }
  return id;
}

const WORK_HABIT_IDS_DAY25 = ['hours_worked','outreach_looms','reel_1','trial_reels_5'];

function workHabitIds(dayIdx){
  return dayIdx >= 24 ? WORK_HABIT_IDS_DAY25 : ORDER.work;
}

function habitsForDay(i){
  const lift = isLiftDay(i);
  // Weight habit is shown only on today and future days (not past).
  const todayIdx = dayIndexFromDate(new Date());
  const out = [];
  for(const cat of ['work','body','discipline']){
    const ids = cat === 'work' ? workHabitIds(i) : ORDER[cat];
    for(const id of ids){
      const actualId = resolveHabitId(id, i);
      const h = HABITS[actualId];
      if(h.liftOnly && !lift) continue;
      if(h.todayOnward && i < todayIdx) continue;
      out.push(h);
    }
  }
  return out;
}

function logsTotal(h, data){
  const v = data.habits[h.id];
  if(!v || !v.logs) return 0;
  if(h.kind === 'protein') return v.logs.reduce((s,l)=>s+(l.grams||0),0);
  if(h.kind === 'count')   return v.logs.length;
  return v.logs.reduce((s,l)=>s+(l.amount||0),0);
}

// All work-related timed habits across all eras — used for cumulative totals (avg/day, total hours worked).
// Day 1–24 logs land in outreach/study/creator; Day 25+ logs land in hours_worked.
const WORK_IDS = ['outreach','study','creator','hours_worked'];
const WORK_FULL = 480;     // 8h
const WORK_FLOOR = 210;    // 30m + 1h + 2h = 3.5h (legacy, unused after floor mode removal)

function workMinutes(data){
  let t = 0;
  if(!data || !data.habits) return 0;
  for(const id of WORK_IDS){
    const v = data.habits[id];
    if(v && Array.isArray(v.logs)){
      for(const log of v.logs) t += (log.amount || 0);
    }
  }
  return t;
}
function anyWorkForce(data){
  if(!data || !data.habits) return false;
  for(const id of WORK_IDS){
    if(data.habits[id] && data.habits[id].forceComplete) return true;
  }
  return false;
}
function workCategoryComplete(data, dayIdx){
  if(dayIdx >= 24){
    // Day 25+: all four work habits must be individually complete
    for(const id of WORK_HABIT_IDS_DAY25){
      if(!habitComplete(HABITS[id], data)) return false;
    }
    return true;
  }
  if(anyWorkForce(data)) return true;
  return workMinutes(data) >= WORK_FULL;
}
function workCategoryPerfect(data, dayIdx){
  if(dayIdx >= 24){
    for(const id of WORK_HABIT_IDS_DAY25){
      if(!habitPerfect(HABITS[id], data)) return false;
    }
    return true;
  }
  if(anyWorkForce(data)) return true;
  return workMinutes(data) >= WORK_FULL;
}

function computeWorkStats(){
  let total = 0;
  for(const key of Object.keys(state.days || {})){
    total += workMinutes(state.days[key]);
  }
  const today = dayIndexFromDate(new Date());
  let denom;
  if(today < 0) denom = 0;
  else denom = Math.min(today + 1, TOTAL_DAYS);
  const avg = denom > 0 ? total / denom : 0;
  return { totalMinutes: total, avgMinutes: avg };
}

function fmtHoursStat(min){
  if(min <= 0) return '0';
  const h = min / 60;
  const r = Math.round(h * 10) / 10;
  if(r === Math.floor(r)) return Math.round(r) + 'h';
  return r.toFixed(1) + 'h';
}
function fmtHr(min){
  if(!min || min <= 0) return '0h';
  const h = min / 60;
  const r = Math.round(h * 10) / 10;
  if(r === Math.floor(r)) return Math.round(r) + 'h';
  return r.toFixed(1) + 'h';
}

function habitComplete(h, data){
  if(h.kind === 'binary'){ return data.habits[h.id] === true; }
  if(h.kind === 'sleep'){
    const v = data.habits[h.id];
    return !!(v && v.done === true);
  }
  if(h.kind === 'weight'){
    const v = data.habits[h.id];
    return !!(v && typeof v.lbs === 'number' && v.lbs > 0);
  }
  const v = data.habits[h.id] || { logs:[], forceComplete:false };
  if(v.forceComplete) return true;
  const total = logsTotal(h, data);
  if(h.kind === 'timed'){ return total >= h.full; }
  if(h.kind === 'protein'){ return total >= h.target; }
  if(h.kind === 'count'){ return total >= h.target; }
  return false;
}

function habitPerfect(h, data){
  if(h.kind === 'binary'){ return data.habits[h.id] === true; }
  if(h.kind === 'sleep'){
    const v = data.habits[h.id];
    return !!(v && v.done === true);
  }
  if(h.kind === 'weight'){
    const v = data.habits[h.id];
    return !!(v && typeof v.lbs === 'number' && v.lbs > 0);
  }
  const v = data.habits[h.id] || { logs:[], forceComplete:false };
  if(v.forceComplete) return true;
  const total = logsTotal(h, data);
  if(h.kind === 'timed'){ return total >= h.full; }
  if(h.kind === 'protein'){ return total >= h.target; }
  if(h.kind === 'count'){ return total >= h.target; }
  return false;
}

function anyMark(h, data){
  if(h.kind === 'binary') return data.habits[h.id] === true;
  const v = data.habits[h.id];
  if(!v) return false;
  if(h.kind === 'sleep') return v.done === true || (v.logs && v.logs.length > 0);
  if(h.kind === 'weight') return typeof v.lbs === 'number' && v.lbs > 0;
  if(v.forceComplete) return true;
  return (v.logs && v.logs.length > 0);
}

function dayStatus(i){
  const date = dateForDayIndex(i);
  const key = ymd(date);
  const data = state.days[key] || { floorMode:false, habits:{} };
  for(const id of ['outreach','study','creator','protein','hours_worked','outreach_looms']){
    if(!data.habits[id] || typeof data.habits[id] !== 'object') data.habits[id] = { logs:[], forceComplete:false };
  }
  const dayHabits = habitsForDay(i);
  const today = dayIndexFromDate(new Date());

  // Day completion is category-based: work, body, discipline.
  // Work category = total hours (day 1–24) or all-four-habits-done (day 25+);
  // body/discipline = each habit individually.
  let satisfied = 0, perfect = 0, marked = false;
  const total = 3;

  if(workCategoryComplete(data, i)) satisfied++;
  if(workCategoryPerfect(data, i)) perfect++;
  if(workMinutes(data) > 0 || anyWorkForce(data)) marked = true;
  if(i >= 24){
    for(const id of WORK_HABIT_IDS_DAY25){
      if(anyMark(HABITS[id], data)) { marked = true; break; }
    }
  }

  for(const cat of ['body','discipline']){
    const catHabits = dayHabits.filter(h => h.cat === cat);
    if(catHabits.length === 0) continue;
    let allDone = true, allPerf = true;
    for(const h of catHabits){
      if(!habitComplete(h, data)) allDone = false;
      if(!habitPerfect(h, data)) allPerf = false;
      if(anyMark(h, data)) marked = true;
    }
    if(allDone) satisfied++;
    if(allPerf) perfect++;
  }

  return {
    dayIdx:i, date, key,
    isException:EXCEPTIONS.has(key),
    isLiftDay:isLiftDay(i),
    floorMode:!!data.floorMode,
    satisfied, perfect, total, anyMark:marked,
    isComplete: satisfied===total,
    isPerfect:  perfect===total,
    isFuture: i>today, isToday: i===today, isPast: i<today,
  };
}

function computeStreak(){
  // Counts consecutive perfect days ending on yesterday. Today is never included,
  // so an incomplete today does not break or reset the streak.
  const today = dayIndexFromDate(new Date());
  const upto = Math.min(today - 1, TOTAL_DAYS - 1);
  if(upto < 0) return 0;
  let streak = 0;
  for(let i = upto; i >= 0; i--){
    const s = dayStatus(i);
    if(s.isException){ streak++; continue; }
    if(s.isPerfect) streak++; else break;
  }
  return streak;
}
function computePerfectDays(){
  let n = 0;
  for(let i=0; i<TOTAL_DAYS; i++) if(dayStatus(i).isPerfect) n++;
  return n;
}

// RING SVG — also acts as the check-off button
function ringSVG(progress, opts){
  opts = opts || {};
  const size = opts.size || 36;
  const stroke = opts.stroke || 2.5;
  const r = (size - stroke) / 2 - 0.5;
  const c = 2 * Math.PI * r;
  const p = Math.min(1, Math.max(0, progress));
  const offset = c * (1 - p);
  const cx = size/2, cy = size/2;
  const complete = !!opts.complete;
  const innerR = r - stroke / 2;

  let tick = '';
  if(opts.floorAt !== undefined && opts.floorAt > 0 && opts.floorAt < 1){
    const ang = opts.floorAt * 2 * Math.PI - Math.PI/2;
    const x1 = cx + Math.cos(ang) * (r - 3);
    const y1 = cy + Math.sin(ang) * (r - 3);
    const x2 = cx + Math.cos(ang) * (r + 3);
    const y2 = cy + Math.sin(ang) * (r + 3);
    tick = '<line class="ring-tick" x1="'+x1.toFixed(2)+'" y1="'+y1.toFixed(2)+'" x2="'+x2.toFixed(2)+'" y2="'+y2.toFixed(2)+'" stroke-width="1.5" stroke-linecap="round" />';
  }
  const bg = '<circle class="ring-bg" cx="'+cx+'" cy="'+cy+'" r="'+innerR.toFixed(2)+'" />';
  const check = '<path class="ring-check" d="M '+(cx-5)+' '+cy+' L '+(cx-1)+' '+(cy+4)+' L '+(cx+5.5)+' '+(cy-3.5) +'" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />';

  return '<svg class="ring'+(complete?' complete':'')+'" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'
    + bg
    + '<circle class="ring-track" cx="'+cx+'" cy="'+cy+'" r="'+r.toFixed(2)+'" stroke-width="'+stroke+'" fill="none" />'
    + '<circle class="ring-progress" cx="'+cx+'" cy="'+cy+'" r="'+r.toFixed(2)+'" stroke-width="'+stroke+'" fill="none" '
    + 'stroke-dasharray="'+c.toFixed(2)+'" stroke-dashoffset="'+offset.toFixed(2)+'" stroke-linecap="round" '
    + 'transform="rotate(-90 '+cx+' '+cy+')" />'
    + tick + check + '</svg>';
}

// RENDER
function render(){
  renderHeader();
  renderGrid();
  renderTodayPanel();
  renderedOnce = true;
}

function renderHeader(){
  const today = dayIndexFromDate(new Date());

  // Today's date stat (always the real today)
  const todayDateEl = document.getElementById('header-today-date');
  if(todayDateEl){
    const now = new Date();
    todayDateEl.textContent = formatDate(now);
    todayDateEl.classList.toggle('has-value', today >= 0 && today < TOTAL_DAYS);
  }

  // Day N / 75
  const dayEl = document.getElementById('day-stat');
  if(today < 0){ dayEl.innerHTML = '&mdash;'; dayEl.classList.remove('has-value'); }
  else if(today >= TOTAL_DAYS){ dayEl.innerHTML = '75<span class="stat-sub">/75</span>'; dayEl.classList.add('has-value'); }
  else { dayEl.innerHTML = (today+1)+'<span class="stat-sub">/75</span>'; dayEl.classList.add('has-value'); }

  // Streak (consecutive complete days ending on yesterday)
  const s = computeStreak();
  const sEl = document.getElementById('streak-stat');
  sEl.textContent = s; sEl.classList.toggle('has-value', s > 0);

  // Total perfect days (cumulative)
  const p = computePerfectDays();
  const pEl = document.getElementById('perfect-stat');
  pEl.textContent = p; pEl.classList.toggle('has-value', p > 0);

  // Work stats (cumulative hours + avg / day)
  const w = computeWorkStats();
  const hEl = document.getElementById('hours-stat');
  hEl.textContent = fmtHoursStat(w.totalMinutes);
  hEl.classList.toggle('has-value', w.totalMinutes > 0);
  const aEl = document.getElementById('avg-stat');
  aEl.textContent = fmtHoursStat(w.avgMinutes);
  aEl.classList.toggle('has-value', w.avgMinutes > 0);

  // Day progress bar — "Day N of 75 · X.X%"
  const dayN = today < 0 ? 0 : Math.min(today + 1, TOTAL_DAYS);
  const dayPct = (dayN / TOTAL_DAYS) * 100;
  const progDayEl = document.getElementById('progress-day');
  const progPctEl = document.getElementById('progress-pct');
  const progFillEl = document.getElementById('progress-fill');
  if(progDayEl) progDayEl.textContent = dayN;
  if(progPctEl) progPctEl.textContent = dayPct.toFixed(1) + '%';
  if(progFillEl) progFillEl.style.width = dayPct + '%';

  // Revenue progress bar — "$X / $100,000 · X.X%"
  const revTotal = totalRevenue();
  const revPct = Math.min(100, (revTotal / REVENUE_GOAL) * 100);
  const revTotalEl = document.getElementById('revenue-total');
  const revPctEl = document.getElementById('revenue-pct');
  const revFillEl = document.getElementById('revenue-fill');
  if(revTotalEl) revTotalEl.textContent = formatMoney(revTotal);
  if(revPctEl) revPctEl.textContent = revPct.toFixed(1) + '%';
  if(revFillEl) revFillEl.style.width = revPct + '%';
}

function renderGrid(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  let done = 0;
  for(let i=0; i<TOTAL_DAYS; i++){
    const s = dayStatus(i);
    if(s.isComplete) done++;
    const cell = document.createElement('button');
    cell.type='button'; cell.className='grid-cell'; cell.textContent = String(i+1);
    if(!renderedOnce) cell.style.animationDelay = (i*5)+'ms'; else cell.style.animation='none';
    if(s.isException) cell.classList.add('exception');
    if(s.isComplete) cell.classList.add('complete');
    else if(s.anyMark) cell.classList.add('partial');
    if(s.isToday) cell.classList.add('today');
    if(i===viewingDayIdx) cell.classList.add('viewing');
    const parts = [formatDate(s.date), 'day '+(i+1)];
    if(s.isException) parts.push('exception');
    parts.push(s.isLiftDay?'lift':'rest');
    cell.title = parts.join(' · ');
    cell.addEventListener('click', ()=>{ viewingDayIdx = i; openDrawers.clear(); render(); });
    grid.appendChild(cell);
  }
  const gn = document.getElementById('grid-stat-num');
  if(gn) gn.textContent = done;
}

function renderTodayPanel(){
  const today = dayIndexFromDate(new Date());
  if(viewingDayIdx === null){
    if(today < 0) viewingDayIdx = 0;
    else if(today >= TOTAL_DAYS) viewingDayIdx = TOTAL_DAYS-1;
    else viewingDayIdx = today;
  }
  const i = viewingDayIdx;
  const s = dayStatus(i);
  const data = getDay(s.key);

  // Date label centered at the top of the panel + "Today" button that
  // appears only when viewing a past day.
  const dateLabelEl = document.getElementById('today-panel-date');
  const todayBtnEl  = document.getElementById('today-panel-today-btn');
  if(dateLabelEl){
    dateLabelEl.textContent = formatDate(s.date);
    const isPast = (today >= 0 && i < today);
    dateLabelEl.classList.toggle('past', isPast);
  }
  if(todayBtnEl){
    const todayIdxClamped = Math.max(0, Math.min(TOTAL_DAYS - 1, today));
    const showTodayBtn = (today >= 0 && i < today);
    todayBtnEl.hidden = !showTodayBtn;
    if(showTodayBtn){
      todayBtnEl.onclick = function(){
        viewingDayIdx = todayIdxClamped;
        openDrawers.clear();
        render();
      };
    } else {
      todayBtnEl.onclick = null;
    }
  }

  const body = document.getElementById('today-body');
  body.innerHTML = '';
  if(today < 0 || today >= TOTAL_DAYS){
    const r = document.createElement('div');
    r.className = 'out-of-range';
    r.textContent = today < 0 ? 'program starts may 18, 2026' : 'program complete · '+computePerfectDays()+' perfect of 75';
    body.appendChild(r);
  }
  if(s.isException){
    const b = document.createElement('div');
    b.className = 'banner';
    b.innerHTML = '<span class="banner-dot"></span> pre-approved exception · streak protected';
    body.appendChild(b);
  }
  for(const cat of CATEGORIES) body.appendChild(renderCategory(cat, i, data));
  body.appendChild(renderRevenueSection(i));
}

function formatDateRich(d){
  return DAYS_SHORT[d.getDay()]+' <em>'+MONTHS_SHORT[d.getMonth()]+'</em> '+d.getDate();
}

function renderRevenueSection(dayIdx){
  const key = ymd(dateForDayIndex(dayIdx));
  const entries = (revenueState.days[key] || []).slice();
  entries.sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));
  const dayTotal = entries.reduce((s, e) => s + (e.amount || 0), 0);

  const wrap = document.createElement('div');
  wrap.className = 'category revenue-section';

  // Header
  const header = document.createElement('div');
  header.className = 'category-header';
  header.innerHTML = '<div class="category-name">revenue</div>'
    + '<div class="revenue-day-total' + (dayTotal > 0 ? ' has-value' : '') + '">' + formatMoney(dayTotal) + '</div>';
  wrap.appendChild(header);

  // Form
  const form = document.createElement('div');
  form.className = 'revenue-form';

  const descIn = document.createElement('input');
  descIn.type = 'text';
  descIn.className = 'revenue-desc';
  descIn.placeholder = 'description';
  descIn.autocomplete = 'off';

  const amtIn = document.createElement('input');
  amtIn.type = 'number';
  amtIn.className = 'revenue-amt';
  amtIn.placeholder = '$0';
  amtIn.min = '0';
  amtIn.step = '0.01';

  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'drawer-add-btn';
  btn.textContent = '+ Add';

  const updateReady = ()=>{
    const a = parseFloat(amtIn.value) || 0;
    btn.classList.toggle('ready', a > 0);
  };
  amtIn.addEventListener('input', updateReady);

  const submit = ()=>{
    const a = parseFloat(amtIn.value) || 0;
    if(a <= 0) return;
    const desc = descIn.value.trim();
    addRevenueEntry(desc, a);
    descIn.value = ''; amtIn.value = ''; btn.classList.remove('ready');
    descIn.focus();
  };
  btn.addEventListener('click', submit);
  const onKey = (e)=>{ if(e.key === 'Enter'){ e.preventDefault(); submit(); } };
  descIn.addEventListener('keydown', onKey);
  amtIn.addEventListener('keydown', onKey);

  form.appendChild(descIn);
  form.appendChild(amtIn);
  form.appendChild(btn);
  wrap.appendChild(form);

  // Entries list
  const list = document.createElement('div');
  list.className = 'revenue-list';
  if(entries.length === 0){
    const empty = document.createElement('div');
    empty.className = 'revenue-empty';
    empty.textContent = 'no entries yet';
    list.appendChild(empty);
  } else {
    for(const entry of entries){
      const item = document.createElement('div');
      item.className = 'revenue-item';

      const desc = document.createElement('span');
      desc.className = 'revenue-item-desc';
      desc.textContent = entry.description || '—';

      const amt = document.createElement('span');
      amt.className = 'revenue-item-amount';
      amt.textContent = formatMoney(entry.amount);

      const time = document.createElement('span');
      time.className = 'revenue-item-time';
      time.textContent = formatTime(entry.timestamp);

      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'log-delete';
      del.textContent = '×';
      del.setAttribute('aria-label', 'Delete entry');
      del.addEventListener('click', ()=> deleteRevenueEntry(entry.id));

      item.appendChild(desc);
      item.appendChild(amt);
      item.appendChild(time);
      item.appendChild(del);
      list.appendChild(item);
    }
  }
  wrap.appendChild(list);

  return wrap;
}

function renderCategory(cat, dayIdx, data){
  const habits = habitsForDay(dayIdx).filter(h=>h.cat===cat.id);
  const wrap = document.createElement('div'); wrap.className='category';
  let pct, isFull, displayText;
  if(cat.id === 'work'){
    const t = workMinutes(data);
    const forced = anyWorkForce(data);
    pct = forced ? 100 : Math.min(100, (t / WORK_FULL) * 100);
    isFull = workCategoryComplete(data, dayIdx);
    displayText = fmtHr(t) + ' / 8h';
  } else {
    let done = 0;
    for(const h of habits) if(habitComplete(h, data)) done++;
    const total = habits.length;
    pct = total ? (done/total)*100 : 0;
    isFull = done===total && total>0;
    displayText = done + '/' + total;
  }
  const header = document.createElement('div');
  header.className='category-header';
  header.innerHTML = '<div class="category-name">'+cat.label+'</div>'
    + '<div class="category-progress'+(isFull?' full':'')+'">'+displayText+'</div>';
  wrap.appendChild(header);
  const bar = document.createElement('div'); bar.className='category-bar';
  const fill = document.createElement('div'); fill.className='category-bar-fill';
  bar.appendChild(fill); wrap.appendChild(bar);
  requestAnimationFrame(()=>{ fill.style.width = pct+'%'; });
  const grid = document.createElement('div');
  grid.className = 'category-habits';
  for(const h of habits) grid.appendChild(renderHabit(h, dayIdx, data));
  wrap.appendChild(grid);
  return wrap;
}

function habitMetaText(h, data){
  if(h.kind === 'binary') return '';
  if(h.kind === 'weight'){
    const v = data.habits[h.id];
    if(v && typeof v.lbs === 'number' && v.lbs > 0){
      return '<span class="accent">'+Math.round(v.lbs * 10) / 10+' lbs</span>';
    }
    return '<span class="dim">not logged</span>';
  }
  const v = data.habits[h.id];
  const total = logsTotal(h, data);
  const target = h.kind==='timed' ? h.full : h.target;
  let fmt;
  if(h.kind === 'protein') fmt = (x) => Math.round(x) + 'g';
  else if(h.kind === 'count') fmt = (x) => String(Math.round(x));
  else fmt = fmtHr;
  if(v.forceComplete && total === 0) return '<span class="accent">marked complete</span>';
  if(total === 0) return '<span class="dim" style="margin:0">0</span><span class="dim">/</span>'+fmt(target);
  if(total >= target){
    return '<span class="accent">'+fmt(total)+'</span><span class="dim">·</span><span class="accent">target hit</span>';
  }
  const left = target - total;
  return '<span class="strong">'+fmt(total)+'</span><span class="dim">/</span>'+fmt(target)
    + '<span class="dim">·</span>'+fmt(left)+' to go';
}

function saveWeight(lbs){
  const key = ymd(dateForDayIndex(viewingDayIdx));
  const data = getDay(key);
  if(!data.habits.weight || typeof data.habits.weight !== 'object' || Array.isArray(data.habits.weight)){
    data.habits.weight = { lbs: null };
  }
  data.habits.weight.lbs = lbs;
  weightEditingKey = null;
  saveState(key); render();
}

function renderWeightHabit(h, dayIdx, data){
  const wrap = document.createElement('div');
  wrap.className = 'habit binary-habit weight-habit';
  wrap.dataset.id = h.id;
  const complete = habitComplete(h, data);
  if(complete) wrap.classList.add('done');

  const row = document.createElement('div');
  row.className = 'habit-row'; row.setAttribute('role','button'); row.tabIndex = 0;

  const info = document.createElement('div'); info.className = 'habit-info';
  const label = document.createElement('div'); label.className = 'habit-label';
  label.textContent = h.label;
  info.appendChild(label);

  const key = ymd(dateForDayIndex(dayIdx));
  const isEditing = (weightEditingKey === key);
  const v = data.habits[h.id];
  const currentLbs = (v && typeof v.lbs === 'number' && v.lbs > 0) ? v.lbs : null;

  if(isEditing){
    const editWrap = document.createElement('div');
    editWrap.className = 'weight-edit-row';

    const input = document.createElement('input');
    input.type = 'number';
    input.className = 'weight-input';
    input.placeholder = 'lbs';
    input.min = '0';
    input.step = '0.1';
    input.value = currentLbs == null ? '' : String(currentLbs);
    editWrap.appendChild(input);

    const saveBtn = document.createElement('button');
    saveBtn.type = 'button';
    saveBtn.className = 'weight-save-btn';
    saveBtn.innerHTML = '✓';
    saveBtn.setAttribute('aria-label', 'Save weight');
    editWrap.appendChild(saveBtn);

    info.appendChild(editWrap);

    const commit = () => {
      const raw = input.value.trim();
      if(!raw){
        // Empty value cancels edit without changing
        weightEditingKey = null;
        render();
        return;
      }
      const val = parseFloat(raw);
      if(isNaN(val) || val <= 0){
        weightEditingKey = null;
        render();
        return;
      }
      saveWeight(val);
    };
    saveBtn.addEventListener('click', (e) => { e.stopPropagation(); commit(); });
    input.addEventListener('keydown', (e) => {
      if(e.key === 'Enter'){ e.preventDefault(); commit(); }
      else if(e.key === 'Escape'){ e.preventDefault(); weightEditingKey = null; render(); }
    });
    input.addEventListener('click', (e) => e.stopPropagation());
    // Focus + select existing value after render lands.
    setTimeout(() => { try { input.focus(); input.select(); } catch(_){} }, 0);
  } else {
    const metaHtml = habitMetaText(h, data);
    if(metaHtml){
      const meta = document.createElement('div'); meta.className = 'habit-meta';
      meta.innerHTML = metaHtml;
      // Small edit icon shown only when a weight is already logged.
      if(currentLbs != null){
        const editIcon = document.createElement('button');
        editIcon.type = 'button';
        editIcon.className = 'weight-edit-icon';
        editIcon.innerHTML = '✎';
        editIcon.setAttribute('aria-label', 'Edit weight');
        editIcon.addEventListener('click', (e) => {
          e.stopPropagation();
          weightEditingKey = key;
          render();
        });
        meta.appendChild(editIcon);
      }
      info.appendChild(meta);
    }
  }

  row.appendChild(info);

  // Ring — click also enters edit mode (per spec).
  const progress = complete ? 1 : 0;
  const ringBtn = document.createElement('button');
  ringBtn.type = 'button';
  ringBtn.className = 'habit-ring-btn' + (complete ? ' is-complete' : '');
  ringBtn.setAttribute('aria-label', (complete ? 'Edit weight: ' : 'Log weight: ') + h.label);
  ringBtn.innerHTML = ringSVG(progress, { size: 28, stroke: 2.2, complete: complete });
  ringBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    weightEditingKey = key;
    render();
  });
  row.appendChild(ringBtn);

  // Row click → enter edit (skipping clicks on input / save / ring / edit-icon).
  row.addEventListener('click', (e) => {
    if(e.target.closest('.habit-ring-btn')) return;
    if(e.target.closest('.weight-edit-row')) return;
    if(e.target.closest('.weight-edit-icon')) return;
    weightEditingKey = key;
    render();
  });
  row.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' || e.key === ' '){
      if(document.activeElement && document.activeElement.classList && document.activeElement.classList.contains('weight-input')) return;
      e.preventDefault();
      weightEditingKey = key;
      render();
    }
  });

  wrap.appendChild(row);
  return wrap;
}

function renderHabit(h, dayIdx, data){
  // Weight has its own simple inline-input UI (no drawer).
  if(h.kind === 'weight') return renderWeightHabit(h, dayIdx, data);
  const wrap = document.createElement('div');
  wrap.className = 'habit ' + (DRAWER_KINDS.has(h.kind) ? 'drawer-habit' : 'binary-habit');
  wrap.dataset.id = h.id;
  const complete = habitComplete(h, data);
  if(complete) wrap.classList.add('done');

  const row = document.createElement('div');
  row.className = 'habit-row'; row.setAttribute('role','button'); row.tabIndex = 0;

  const info = document.createElement('div'); info.className='habit-info';
  const label = document.createElement('div'); label.className='habit-label'; label.textContent = h.label;
  info.appendChild(label);
  const metaHtml = habitMetaText(h, data);
  if(metaHtml){
    const meta = document.createElement('div'); meta.className='habit-meta'; meta.innerHTML = metaHtml;
    info.appendChild(meta);
  }
  row.appendChild(info);

  // Ring — single element that shows progress AND checks off the habit
  let progress = 0;
  let isComplete = false;
  if(h.kind === 'binary'){
    const v = data.habits[h.id];
    isComplete = (v === true);
    progress = isComplete ? 1 : 0;
  } else if(h.kind === 'sleep'){
    const v = data.habits[h.id];
    isComplete = !!(v && v.done === true);
    progress = isComplete ? 1 : 0;
  } else {
    const v = data.habits[h.id];
    const total = logsTotal(h, data);
    const target = h.kind==='timed' ? h.full : h.target;
    progress = v.forceComplete ? 1 : Math.min(1, total / target);
    isComplete = v.forceComplete || total >= target;
  }
  const ringOpts = { size:28, stroke:2.2, complete:isComplete };
  const ringBtn = document.createElement('button');
  ringBtn.type = 'button';
  ringBtn.className = 'habit-ring-btn' + (isComplete ? ' is-complete' : '');
  ringBtn.setAttribute('aria-label', (isComplete?'Mark incomplete: ':'Mark complete: ') + h.label);
  ringBtn.innerHTML = ringSVG(progress, ringOpts);
  ringBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    const wasComplete = isComplete;
    handleRingClick(h);
    if(!wasComplete){
      // brief pulse if newly completed
      const newData = getDay(ymd(dateForDayIndex(viewingDayIdx)));
      if(habitComplete(h, newData)){
        ringBtn.classList.add('just-completed');
      }
    }
  });
  row.appendChild(ringBtn);

  // Row click: drawer habits → toggle drawer; binary → also toggle complete
  row.addEventListener('click', (e)=>{
    if(e.target.closest('.habit-ring-btn')) return;
    handleRowClick(h);
  });
  row.addEventListener('keydown', (e)=>{
    if(e.key==='Enter' || e.key===' '){ e.preventDefault(); handleRowClick(h); }
  });

  wrap.appendChild(row);

  // Drawer
  if(DRAWER_KINDS.has(h.kind)){
    const isOpen = openDrawers.has(h.id);
    if(isOpen) wrap.classList.add('expanded');
    const drawer = document.createElement('div');
    drawer.className = 'habit-drawer' + (isOpen ? ' open' : '');
    const clip = document.createElement('div'); clip.className='drawer-clip';
    const inner = document.createElement('div'); inner.className='drawer-inner';
    inner.appendChild(renderDrawerControls(h, data));
    inner.appendChild(renderDrawerLogs(h, data));
    clip.appendChild(inner);
    drawer.appendChild(clip);
    wrap.appendChild(drawer);
  }

  return wrap;
}

function renderDrawerControls(h, data){
  const row = document.createElement('div');
  row.className = 'drawer-add-row';

  if(h.kind === 'timed'){
    const hIn = document.createElement('input');
    hIn.type='number'; hIn.className='drawer-num'; hIn.placeholder='h'; hIn.min='0';
    const mIn = document.createElement('input');
    mIn.type='number'; mIn.className='drawer-num'; mIn.placeholder='m'; mIn.min='0';
    const btn = document.createElement('button');
    btn.type='button'; btn.className='drawer-add-btn'; btn.textContent='+ Add';
    const updateReady = ()=>{
      const hv = parseFloat(hIn.value)||0;
      const mv = parseFloat(mIn.value)||0;
      if(hv > 0 || mv > 0) btn.classList.add('ready'); else btn.classList.remove('ready');
    };
    hIn.addEventListener('input', updateReady);
    mIn.addEventListener('input', updateReady);
    const submit = ()=>{
      const hv = parseFloat(hIn.value)||0;
      const mv = parseFloat(mIn.value)||0;
      const total = Math.round(hv*60 + mv);
      if(total <= 0) return;
      addTimedLog(h.id, total);
      hIn.value=''; mIn.value=''; btn.classList.remove('ready');
      hIn.focus();
    };
    btn.addEventListener('click', submit);
    const onKey = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); submit(); } };
    hIn.addEventListener('keydown', onKey);
    mIn.addEventListener('keydown', onKey);
    row.appendChild(hIn); row.appendChild(mIn); row.appendChild(btn);
  } else if(h.kind === 'protein'){
    const tIn = document.createElement('input');
    tIn.type='text'; tIn.className='drawer-text'; tIn.placeholder='label (e.g. 5 eggs)'; tIn.autocomplete='off';
    const gIn = document.createElement('input');
    gIn.type='number'; gIn.className='drawer-num drawer-num-grams'; gIn.placeholder='g'; gIn.min='0';
    const btn = document.createElement('button');
    btn.type='button'; btn.className='drawer-add-btn'; btn.textContent='+ Add';
    const updateReady = ()=>{ const g=parseFloat(gIn.value)||0; if(g>0) btn.classList.add('ready'); else btn.classList.remove('ready'); };
    gIn.addEventListener('input', updateReady);
    const submit = ()=>{
      const g = Math.round(parseFloat(gIn.value)||0);
      if(g <= 0) return;
      const label = tIn.value.trim();
      addProteinLog(label, g);
      tIn.value=''; gIn.value=''; btn.classList.remove('ready');
      tIn.focus();
    };
    btn.addEventListener('click', submit);
    const onKey = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); submit(); } };
    tIn.addEventListener('keydown', onKey);
    gIn.addEventListener('keydown', onKey);
    row.appendChild(tIn); row.appendChild(gIn); row.appendChild(btn);
  } else if(h.kind === 'sleep'){
    const hIn = document.createElement('input');
    hIn.type='number'; hIn.className='drawer-num'; hIn.placeholder='h'; hIn.min='0';
    const mIn = document.createElement('input');
    mIn.type='number'; mIn.className='drawer-num'; mIn.placeholder='m'; mIn.min='0';
    const btn = document.createElement('button');
    btn.type='button'; btn.className='drawer-add-btn'; btn.textContent='+ Add';
    const updateReady = ()=>{
      const hv = parseFloat(hIn.value)||0;
      const mv = parseFloat(mIn.value)||0;
      if(hv > 0 || mv > 0) btn.classList.add('ready'); else btn.classList.remove('ready');
    };
    hIn.addEventListener('input', updateReady);
    mIn.addEventListener('input', updateReady);
    const submit = ()=>{
      const hv = parseFloat(hIn.value)||0;
      const mv = parseFloat(mIn.value)||0;
      const total = Math.round(hv*60 + mv);
      if(total <= 0) return;
      addSleepLog(total);
      hIn.value=''; mIn.value=''; btn.classList.remove('ready');
      hIn.focus();
    };
    btn.addEventListener('click', submit);
    const onKey = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); submit(); } };
    hIn.addEventListener('keydown', onKey);
    mIn.addEventListener('keydown', onKey);

    tIn.type='text'; tIn.className='drawer-text'; tIn.placeholder='name'; tIn.autocomplete='off';

      tIn.value=''; btn.classList.remove('ready');
      tIn.focus();

function renderDrawerLogs(h, data){
  const logs = (data.habits[h.id] && data.habits[h.id].logs) ? data.habits[h.id].logs.slice() : [];
  logs.sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
  const wrap = document.createElement('div'); wrap.className='drawer-logs';
  if(logs.length === 0){
    const empty = document.createElement('div');
    empty.className = 'drawer-empty';
    empty.textContent = 'no entries yet';
    wrap.appendChild(empty);
    return wrap;
  }
  for(const log of logs){
    const e = document.createElement('div'); e.className='log-entry';
    const c = document.createElement('div'); c.className='log-content';
    if(h.kind === 'protein'){
      if(log.label){
        const lab = document.createElement('span'); lab.className='log-label'; lab.textContent = log.label;
        c.appendChild(lab);
        c.appendChild(makeSep());
      }
      const a = document.createElement('span'); a.className='log-amount'; a.textContent = Math.round(log.grams)+'g';
      c.appendChild(a);
    } else if(h.kind === 'count'){
      const lab = document.createElement('span'); lab.className='log-label'; lab.textContent = log.label || '—';
      c.appendChild(lab);
    } else {
      const a = document.createElement('span'); a.className='log-amount'; a.textContent = fmtHr(log.amount);
      c.appendChild(a);
    }
    const t = document.createElement('span'); t.className='log-time'; t.textContent = formatTime(log.timestamp);
    c.appendChild(t);
    e.appendChild(c);
    const del = document.createElement('button');
    del.type='button'; del.className='log-delete'; del.textContent='×';
    del.setAttribute('aria-label','Delete entry');
    del.addEventListener('click', ()=>{ deleteLog(h.id, log.id); });
    e.appendChild(del);
    wrap.appendChild(e);
  }
  return wrap;
}
function makeSep(){ const s=document.createElement('span'); s.className='log-sep'; s.textContent='·'; return s; }

// ACTIONS
function handleRowClick(h){
  // Drawer habits: row body opens/closes the drawer.
  // Binary habits: no drawer — row body click toggles complete (same as ring).
  if(h.kind === 'binary'){ handleRingClick(h); return; }
  if(openDrawers.has(h.id)) openDrawers.delete(h.id); else openDrawers.add(h.id);
  render();
}

function handleRingClick(h){
  const key = ymd(dateForDayIndex(viewingDayIdx));
  const data = getDay(key);
  if(h.kind === 'binary'){
    data.habits[h.id] = !data.habits[h.id];
  } else if(h.kind === 'sleep'){
    data.habits.sleep.done = !data.habits.sleep.done;
  } else if(h.id === 'hours_worked'){
    // Hours Worked: if total < 8h, auto-log the remaining time.
    // If already at/over 8h, fall back to the standard force-complete toggle.
    const v = data.habits.hours_worked || (data.habits.hours_worked = { logs:[], forceComplete:false });
    if(!Array.isArray(v.logs)) v.logs = [];
    const total = v.logs.reduce((s, l) => s + (l.amount || 0), 0);
    if(total < 480){
      v.logs.push({ id: genId(), amount: 480 - total, timestamp: Date.now() });
    } else {
      v.forceComplete = !v.forceComplete;
    }
  } else {
    if(!data.habits[h.id] || typeof data.habits[h.id] !== 'object') data.habits[h.id] = { logs:[], forceComplete:false };
    data.habits[h.id].forceComplete = !data.habits[h.id].forceComplete;
  }
  saveState(key); render();
}

function addTimedLog(habitId, minutes){
  const key = ymd(dateForDayIndex(viewingDayIdx));
  const data = getDay(key);
  data.habits[habitId].logs.push({ id:genId(), amount:minutes, timestamp:Date.now() });
  saveState(key); render();
}
function addCountLog(habitId, label){
  const key = ymd(dateForDayIndex(viewingDayIdx));
  const data = getDay(key);
  if(!data.habits[habitId] || typeof data.habits[habitId] !== 'object') data.habits[habitId] = { logs:[], forceComplete:false };
  data.habits[habitId].logs.push({ id:genId(), label:label||'', timestamp:Date.now() });
  saveState(key); render();
}
function addSleepLog(minutes){
  const key = ymd(dateForDayIndex(viewingDayIdx));
  const data = getDay(key);
  data.habits.sleep.logs.push({ id:genId(), amount:minutes, timestamp:Date.now() });
  saveState(key); render();
}
function addProteinLog(label, grams){
  const key = ymd(dateForDayIndex(viewingDayIdx));
  const data = getDay(key);
  data.habits.protein.logs.push({ id:genId(), label:label||'', grams, timestamp:Date.now() });
  saveState(key); render();
}
function deleteLog(habitId, logId){
  const key = ymd(dateForDayIndex(viewingDayIdx));
  const data = getDay(key);
  const v = data.habits[habitId];
  if(!v || !v.logs) return;
  v.logs = v.logs.filter(l=>l.id !== logId);
  saveState(key); render();
}

// ===== CLOUD SYNC (habit_days + revenue_entries via Supabase) =====
// Cred key is shared with the outreach tracker but each IIFE builds its own
// client; nothing else is shared between them.
const SUPABASE_CREDS_KEY_AARON = '75aaron_supabase_creds';
const CLOUD_SCHEMA_SQL = [
  "create table if not exists habit_days (",
  "  id uuid default gen_random_uuid() primary key,",
  "  day_index integer not null unique,",
  "  data jsonb not null,",
  "  updated_at timestamptz default now()",
  ");",
  "",
  "create table if not exists revenue_entries (",
  "  id uuid default gen_random_uuid() primary key,",
  "  day_index integer not null,",
  "  description text,",
  "  amount numeric not null,",
  "  timestamp timestamptz not null,",
  "  created_at timestamptz default now()",
  ");",
  "",
  "alter table habit_days disable row level security;",
  "alter table revenue_entries disable row level security;"
].join('\n');

let cloudClient = null;
function getCloudClient(){
  if(cloudClient) return cloudClient;
  if(!window.supabase || !window.supabase.createClient) return null;
  try {
    const raw = localStorage.getItem(SUPABASE_CREDS_KEY_AARON);
    if(!raw) return null;
    const creds = JSON.parse(raw);
    if(!creds || !creds.url || !creds.key) return null;
    cloudClient = window.supabase.createClient(creds.url, creds.key);
    return cloudClient;
  } catch(_){ return null; }
}

function dayIndexFromKey(key){
  // key is "YYYY-MM-DD". Parse explicitly so we stay in local time.
  const parts = (key || '').split('-');
  if(parts.length !== 3) return null;
  const y = +parts[0], m = +parts[1], d = +parts[2];
  if(!y || !m || !d) return null;
  return dayIndexFromDate(new Date(y, m-1, d));
}

function isMissingTableError(err){
  if(!err) return false;
  const code = err.code || '';
  return code === '42P01' || code === 'PGRST205';
}

// ----- Fire-and-forget writes (silent on failure) -----
function cloudUpsertHabitDay(dayKey){
  const sb = getCloudClient();
  if(!sb) return;
  const idx = dayIndexFromKey(dayKey);
  if(idx === null || idx < 0) return;
  const data = state.days[dayKey];
  if(!data) return;
  sb.from('habit_days').upsert({
    day_index: idx,
    data: data,
    updated_at: new Date().toISOString()
  }, { onConflict: 'day_index' }).then(function(r){
    void r; // silent
  }, function(){ /* silent */ });
}

function cloudInsertRevenueEntry(dayKey, entry){
  const sb = getCloudClient();
  if(!sb) return Promise.resolve(null);
  const idx = dayIndexFromKey(dayKey);
  if(idx === null || idx < 0) return Promise.resolve(null);
  return sb.from('revenue_entries').insert({
    day_index: idx,
    description: entry.description || '',
    amount: entry.amount,
    timestamp: new Date(entry.timestamp).toISOString()
  }).select().single().then(function(r){
    if(r && r.data && r.data.id) return r.data.id;
    return null;
  }, function(){ return null; });
}

function cloudDeleteRevenueEntry(entryId){
  const sb = getCloudClient();
  if(!sb || !entryId) return;
  // Only attempt deletion if the id looks like a UUID (was created or
  // migrated through Supabase). Pre-migration random ids are local-only.
  if(!/^[0-9a-f-]{36}$/i.test(entryId)) return;
  sb.from('revenue_entries').delete().eq('id', entryId).then(
    function(){ /* silent */ },
    function(){ /* silent */ }
  );
}

// ----- Bulk reads (initial bootstrap) -----
async function cloudFetchAllHabitDays(){
  const sb = getCloudClient();
  if(!sb) return null;
  const r = await sb.from('habit_days').select('day_index, data');
  if(r.error) return { error: r.error };
  return { rows: r.data || [] };
}
async function cloudFetchAllRevenueEntries(){
  const sb = getCloudClient();
  if(!sb) return null;
  const r = await sb.from('revenue_entries')
    .select('id, day_index, description, amount, timestamp')
    .order('timestamp', { ascending: true });
  if(r.error) return { error: r.error };
  return { rows: r.data || [] };
}

// ----- Bootstrap on load: pull fresh from cloud, replace state, re-render.
//      Silent fallback to localStorage on any failure.
async function bootstrapFromCloud(opts){
  opts = opts || {};
  const sb = getCloudClient();
  if(!sb) return;
  try {
    const [h, r] = await Promise.all([
      cloudFetchAllHabitDays(),
      cloudFetchAllRevenueEntries()
    ]);
    // Both null = no creds; either with .error = transient/schema issue.
    if(!h || !r) return;
    if(h.error || r.error) return;

    // Habit days — cloud is source of truth on load.
    if(h.rows.length > 0){
      const nextDays = {};
      for(const row of h.rows){
        const key = ymd(dateForDayIndex(row.day_index));
        nextDays[key] = row.data;
      }
      state.days = nextDays;
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
    }

    // Revenue — same.
    if(r.rows.length > 0){
      const nextRevDays = {};
      for(const row of r.rows){
        const key = ymd(dateForDayIndex(row.day_index));
        if(!nextRevDays[key]) nextRevDays[key] = [];
        nextRevDays[key].push({
          id: row.id,
          description: row.description || '',
          amount: Number(row.amount) || 0,
          timestamp: row.timestamp ? new Date(row.timestamp).getTime() : Date.now()
        });
      }
      revenueState.days = nextRevDays;
      try { localStorage.setItem(REVENUE_KEY, JSON.stringify(revenueState)); }catch(e){}
    }
    // Skip re-render when the caller is going to render() right after — avoids
    // a double-paint during initial boot.
    if(!opts.skipFinalRender) render();
  } catch(_){ /* silent fallback to localStorage already in state */ }
}

// INIT

function scheduleMidnightRefresh(){
  const now = new Date();
  const next = new Date(now.getFullYear(), now.getMonth(), now.getDate()+1, 0, 0, 5);
  setTimeout(()=>{ viewingDayIdx = null; openDrawers.clear(); render(); scheduleMidnightRefresh(); }, next.getTime()-now.getTime());
}

// When Supabase credentials are present, AWAIT the cloud fetch before the
// first render so cross-device loads see real data immediately (not a flash
// of empty localStorage). If creds are missing or the fetch fails, render
// from localStorage as the silent fallback.
async function initialBoot(){
  if(getCloudClient()){
    try { await bootstrapFromCloud({ skipFinalRender: true }); } catch(_){}
  }
  render();
  scheduleMidnightRefresh();
}
initialBoot();

// TABS — switch between "75 Aaron" and "X"
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    const target = btn.dataset.tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === target));
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.toggle('active', p.dataset.pane === target));
  });
});
})();

  // HELPERS
  function escapeHtml(str){
    return String(str == null ? '' : str).replace(/[&<>"']/g, function(m){
      return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[m];

  function errMsg(e){

  const MONTHS_FULL = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const MONTHS_LOWER = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  function fmtDateTime(iso){
    if(!iso) return '';
    const d = new Date(iso);
    if(isNaN(d.getTime())) return '';
    const month = MONTHS_FULL[d.getMonth()];
    const day = d.getDate();
    let h = d.getHours();
    const m = d.getMinutes();
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    return month + ' ' + day + ' · ' + h + ':' + String(m).padStart(2, '0') + ' ' + ampm;
  }
  function fmtDateShort(iso){
    if(!iso) return '';
    const d = new Date(iso);
    if(isNaN(d.getTime())) return '';
    return MONTHS_LOWER[d.getMonth()] + ' ' + d.getDate();
  }

  function lastHistory(leadId){
    const hist = leadHistories.get(leadId);
    if(!hist || hist.length === 0) return null;
    return hist[hist.length - 1];
  }
  function lastNoteForLead(leadId){
    const hist = leadHistories.get(leadId);
    if(!hist) return null;
    // Most recent (later changed_at) history row with a non-empty notes field.
    for(let i = hist.length - 1; i >= 0; i--){
      if(hist[i].notes) return hist[i].notes;
    }
    return null;
  }
  function lastUpdatedIsoFor(leadId, fallback){
    // The most recent timestamp across all status changes AND note edits.
    const hist = leadHistories.get(leadId) || [];
    let latestMs = 0;
    let latestIso = null;
    for(const h of hist){
      if(h.changed_at){
        const t = new Date(h.changed_at).getTime();
        if(t > latestMs){ latestMs = t; latestIso = h.changed_at; }
      }
      const edits = noteEditsByHistoryId.get(h.id) || [];
      for(const e of edits){
        if(!e.edited_at) continue;
        const t = new Date(e.edited_at).getTime();
        if(t > latestMs){ latestMs = t; latestIso = e.edited_at; }
      }
    }
    return latestIso || fallback || null;
  }
  function sortLeads(arr){
    const copy = arr.slice();
    if(currentSort === 'oldest-added'){
      copy.sort(function(a,b){ return new Date(a.created_at) - new Date(b.created_at); });
    } else if(currentSort === 'newest-added'){
      copy.sort(function(a,b){ return new Date(b.created_at) - new Date(a.created_at); });
    } else if(currentSort === 'least-updated'){
      copy.sort(function(a,b){
        const ta = new Date(lastUpdatedIsoFor(a.id, a.created_at)).getTime();
        const tb = new Date(lastUpdatedIsoFor(b.id, b.created_at)).getTime();
        return ta - tb;
      });
    } else if(currentSort === 'rating-desc' || currentSort === 'rating-asc'){
      // Unrated leads always sort last regardless of direction.
      const dir = currentSort === 'rating-desc' ? -1 : 1;
      copy.sort(function(a,b){
        const ar = (a.rating == null) ? null : Number(a.rating);
        const br = (b.rating == null) ? null : Number(b.rating);
        if(ar == null && br == null) return 0;
        if(ar == null) return 1;
        if(br == null) return -1;
        return dir * (ar - br);
      });
    } else {
      // recent-updated (default)
      copy.sort(function(a,b){
        const ta = new Date(lastUpdatedIsoFor(a.id, a.created_at)).getTime();
        const tb = new Date(lastUpdatedIsoFor(b.id, b.created_at)).getTime();
        return tb - ta;
      });
    }
    return copy;
  }
  const SORT_OPTIONS = [
    { value: 'recent-updated', label: 'Most recently updated' },

  function sortLabel(value){

    return value;
  }

  // SCHEMA CHECK + AUTO-CREATE ATTEMPT
  async function checkSchema(){
    if(!supabaseClient) return false;
    const r = await supabaseClient.from('outreach_statuses').select('id').limit(1);
    if(!r.error) return true;
    const msg = (r.error.message || '') + ' ' + (r.error.code || '');
    if(/does not exist|relation .* does not exist|PGRST205|42P01|404/i.test(msg)) return false;
    throw r.error;
  }
  async function tryAutoCreateSchema(){
    // Anon key normally can't run DDL — these RPC attempts only succeed if the
    // user has pre-installed a permissive exec function. We try and silently
    // fall through to the manual setup panel when they don't.
    const attempts = [
      function(){ return supabaseClient.rpc('exec_sql', { sql: SCHEMA_SQL }); },
      function(){ return supabaseClient.rpc('execute_sql', { query: SCHEMA_SQL }); },
      function(){ return supabaseClient.rpc('run_sql', { query: SCHEMA_SQL }); }
    ];
    for(const fn of attempts){
      try {
        const r = await fn();
        if(r && !r.error) return true;
      } catch(_){}
    }
    return false;
  }

  // MIGRATION CHECK — notes column moved from leads → status history,
  // and notes_updated_at column on status history tracks inline edits.
  async function checkMigration(){
    if(!supabaseClient) return false;
    const r1 = await supabaseClient.from('outreach_status_history').select('id, notes, notes_updated_at').limit(1);
    if(r1.error){
      const msg = (r1.error.message || '') + ' ' + (r1.error.code || '');
      if(/column .* (notes|notes_updated_at)|(notes|notes_updated_at) .* does not exist|PGRST204|42703/i.test(msg)) return false;
      throw r1.error;
    }
    // Also require the outreach_note_edits table for the per-edit activity log.
    const r2 = await supabaseClient.from('outreach_note_edits').select('id').limit(1);
    if(r2.error){
      const msg = (r2.error.message || '') + ' ' + (r2.error.code || '');
      if(/does not exist|relation .* does not exist|PGRST205|42P01|404/i.test(msg)) return false;
      throw r2.error;
    }
    // Rating column on outreach_leads (added in the rating-column change).
    const r3 = await supabaseClient.from('outreach_leads').select('id, rating').limit(1);
    if(r3.error){
      const msg = (r3.error.message || '') + ' ' + (r3.error.code || '');
      if(/column .* rating|rating .* does not exist|PGRST204|42703/i.test(msg)) return false;
      throw r3.error;
    }
    return true;
  }
  async function tryAutoMigrate(){
    const attempts = [
      function(){ return supabaseClient.rpc('exec_sql', { sql: MIGRATION_SQL }); },
      function(){ return supabaseClient.rpc('execute_sql', { query: MIGRATION_SQL }); },
      function(){ return supabaseClient.rpc('run_sql', { query: MIGRATION_SQL }); }
    ];
    for(const fn of attempts){
      try {
        const r = await fn();
        if(r && !r.error) return true;
      } catch(_){}
    }
    return false;
  }

  // DATA OPERATIONS
  async function loadStatuses(){
    const r = await supabaseClient.from('outreach_statuses').select('*').order('sort_order', { ascending: true });
    if(r.error) throw r.error;
    statuses = r.data || [];
  }
  async function loadLeads(){
    const r = await supabaseClient.from('outreach_leads').select('*').order('created_at', { ascending: false });
    if(r.error) throw r.error;

  }
  async function loadLeadHistory(leadId){
    const r = await supabaseClient.from('outreach_status_history')
      .select('*').eq('lead_id', leadId).order('changed_at', { ascending: true });
    if(r.error) throw r.error;
    return r.data || [];
  }
  async function loadAllHistories(){
    // Pre-load every history row in chronological order so collapsed rows
    // can render the most-recent status timestamp and most-recent note
    // without an extra round-trip per row.
    const r = await supabaseClient.from('outreach_status_history')
      .select('*').order('changed_at', { ascending: true });
    if(r.error) throw r.error;
    leadHistories.clear();
    const rows = r.data || [];
    for(const h of rows){
      if(!leadHistories.has(h.lead_id)) leadHistories.set(h.lead_id, []);
      leadHistories.get(h.lead_id).push(h);
    }
  }
  async function loadAllNoteEdits(){
    const r = await supabaseClient.from('outreach_note_edits')
      .select('*').order('edited_at', { ascending: true });
    if(r.error) throw r.error;
    noteEditsByHistoryId.clear();
    for(const e of (r.data || [])){
      if(!noteEditsByHistoryId.has(e.history_id)) noteEditsByHistoryId.set(e.history_id, []);
      noteEditsByHistoryId.get(e.history_id).push(e);
    }
  }
  async function createNoteEdit(historyId, oldNotes, newNotes){
    // Inserts a new row in outreach_note_edits AND updates the history
    // row's notes column to the new value so the current state stays in sync.
    const ins = await supabaseClient.from('outreach_note_edits').insert({
      history_id: historyId,
      old_notes: oldNotes,
      new_notes: newNotes
    }).select().single();
    if(ins.error) throw ins.error;
    const upd = await supabaseClient.from('outreach_status_history')
      .update({ notes: newNotes || null, notes_updated_at: new Date().toISOString() })
      .eq('id', historyId);
    if(upd.error) throw upd.error;
    return ins.data;
  }
  async function createLead(fields){
    const ins = await supabaseClient.from('outreach_leads').insert({
      name: fields.name,
      profile_url: fields.profile_url || null,
      status: fields.status,
      rating: (fields.rating == null) ? null : fields.rating
    }).select().single();
    if(ins.error) throw ins.error;
    const hist = await supabaseClient.from('outreach_status_history').insert({
      lead_id: ins.data.id,
      old_status: null,
      new_status: fields.status,
      notes: fields.notes || null
    }).select().single();
    if(hist.error) throw hist.error;
    return { lead: ins.data, history: hist.data };

  async function updateLeadFields(id, updates){
    const r = await supabaseClient.from('outreach_leads').update(updates).eq('id', id);
    if(r.error) throw r.error;

  async function updateLeadRating(id, rating){

    const r = await supabaseClient.from('outreach_leads')

  async function changeStatusWithNote(lead, newStatus, note){
    if(lead.status === newStatus) return;
    const u = await supabaseClient.from('outreach_leads').update({ status: newStatus }).eq('id', lead.id);
    if(u.error) throw u.error;
    const h = await supabaseClient.from('outreach_status_history').insert({
      lead_id: lead.id,
      old_status: lead.status,
      new_status: newStatus,
      notes: note || null
    });
    if(h.error) throw h.error;
  }
  async function setHistoryNoteInitial(historyId, note){
    // For the create-flow note prompt — first time the note is set on a
    // freshly-inserted history row, so we don't flag it as "edited".
    const r = await supabaseClient.from('outreach_status_history')
      .update({ notes: note || null })
      .eq('id', historyId);
    if(r.error) throw r.error;
  }
  async function updateHistoryNote(historyId, note){
    // For inline edits from the activity log — stamps notes_updated_at.
    const r = await supabaseClient.from('outreach_status_history')
      .update({ notes: note || null, notes_updated_at: new Date().toISOString() })
      .eq('id', historyId);
    if(r.error) throw r.error;
  }
  async function deleteLead(id){
    const r = await supabaseClient.from('outreach_leads').delete().eq('id', id);
    if(r.error) throw r.error;
  }
  // Per change #3 (this round): delete a single history row, then update the
  // lead's current status to the previous one (the new "newest" history row's
  // new_status). If the deleted row was the only history row, the lead is
  // left without history — the caller should have warned first.
  async function deleteHistoryRow(historyId, leadId){
    const del = await supabaseClient.from('outreach_status_history')
      .delete().eq('id', historyId);
    if(del.error) throw del.error;
    // Reload the lead's history newest-first, pick its new current status.
    const r = await supabaseClient.from('outreach_status_history')
      .select('id, new_status, changed_at')
      .eq('lead_id', leadId)
      .order('changed_at', { ascending: false })
      .limit(1);
    if(r.error) throw r.error;
    if(r.data && r.data.length){
      const upd = await supabaseClient.from('outreach_leads')
        .update({ status: r.data[0].new_status })
        .eq('id', leadId);
      if(upd.error) throw upd.error;
    }
  }
  async function deleteNoteEditRow(editId){
    // Per change #3 (this round): before deleting the note edit, revert the
    // parent history row's `notes` column to the `old_notes` stored on this
    // edit. That way the activity log and the displayed note stay consistent
    // — deleting the edit undoes it rather than leaving the post-edit value.
    let parentHistoryId = null;
    let oldNotesToRestore = null;
    noteEditsByHistoryId.forEach(function(arr, historyId){
      if(parentHistoryId) return;
      for(const e of arr){
        if(e.id === editId){
          parentHistoryId = historyId;
          oldNotesToRestore = (e.old_notes == null) ? null : e.old_notes;
          break;
        }
      }
    });
    if(parentHistoryId){
      // Use the same update shape as setHistoryNoteInitial so we don't stamp
      // notes_updated_at (this isn't a fresh edit — it's a revert).
      const upd = await supabaseClient.from('outreach_status_history')
        .update({ notes: oldNotesToRestore || null })
        .eq('id', parentHistoryId);
      if(upd.error) throw upd.error;
    }
    const del = await supabaseClient.from('outreach_note_edits')
      .delete().eq('id', editId);
    if(del.error) throw del.error;
  }
  async function createStatus(fields){
    const maxOrder = statuses.length ? Math.max.apply(null, statuses.map(function(s){ return s.sort_order || 0; })) : -1;
    const r = await supabaseClient.from('outreach_statuses').insert({
      label: fields.label, color: fields.color, sort_order: maxOrder + 1
    }).select().single();
    if(r.error) throw r.error;
    return r.data;
  }
  async function deleteStatusById(id){
    const status = statuses.find(function(s){ return s.id === id; });
    if(!status) return;
    const usedBy = leads.filter(function(l){ return l.status === status.label; }).length;
    if(usedBy > 0) throw new Error('Cannot delete — ' + usedBy + ' lead' + (usedBy === 1 ? '' : 's') + ' still use this status.');
    const r = await supabaseClient.from('outreach_statuses').delete().eq('id', id);
    if(r.error) throw r.error;
  }

  // INIT FLOW
  async function init(){
    if(!ensureClient()){
      phase = 'no-creds';
      render();
      return;
    }
    phase = 'init';
    render();
    try {
      let ok = await checkSchema();
      if(!ok){
        const autoOk = await tryAutoCreateSchema();
        if(autoOk){
          ok = await checkSchema();
        }
      }
      if(!ok){
        phase = 'no-schema';
        render();
        return;
      }
      // Migration check: history.notes column must exist
      let migrated = await checkMigration();
      if(!migrated){
        const autoOk = await tryAutoMigrate();
        if(autoOk){
          migrated = await checkMigration();
        }
      }
      if(!migrated){
        phase = 'no-migration';
        render();
        return;
      }
      await loadStatuses();
      await loadLeads();
      await loadAllHistories();
      await loadAllNoteEdits();
      phase = 'ready';
      render();
    } catch(e){
      lastError = errMsg(e);
      phase = 'error';
      render();
    }
  }

  // RENDER
  function render(){
    const root = document.getElementById('outreach-root');
    if(!root) return;
    if(phase === 'init')       return renderInit(root);
    if(phase === 'no-creds')   return renderCredsForm(root);
    if(phase === 'no-schema')  return renderSchemaSetup(root);
    if(phase === 'no-migration') return renderMigrationSetup(root);
    if(phase === 'error')      return renderError(root);
    if(phase === 'ready')      return renderTracker(root);
  }

  function renderSchemaSetup(root){
    const creds = loadCreds();
    const editorUrl = creds ? getSqlEditorUrl(creds.url) : null;
    root.innerHTML =
      '<div class="supabase-panel">' +

  // Real-time search: matches lead name, profile URL, and any note text
  // across the lead's full status history and note edits. Case-insensitive.
  function leadMatchesSearch(lead, qLower){
    if(!qLower) return true;
    if((lead.name || '').toLowerCase().indexOf(qLower) !== -1) return true;
    if((lead.profile_url || '').toLowerCase().indexOf(qLower) !== -1) return true;
    const history = leadHistories.get(lead.id) || [];
    for(const h of history){
      if(h.notes && h.notes.toLowerCase().indexOf(qLower) !== -1) return true;
      const edits = noteEditsByHistoryId.get(h.id) || [];
      for(const e of edits){
        if(e.new_notes && e.new_notes.toLowerCase().indexOf(qLower) !== -1) return true;
        if(e.old_notes && e.old_notes.toLowerCase().indexOf(qLower) !== -1) return true;
      }
    }
    return false;
  }

      ? statusFiltered.filter(function(l){ return leadMatchesSearch(l, qLower); })

  function nextSortValue(value){
    // Kept for backwards compat with any callers. The cycling button is gone
    // as of change #4, but the helper is harmless dead code.
    if(value === 'recent-updated') return 'least-updated';
    if(value === 'least-updated')  return 'newest-added';
    if(value === 'newest-added')   return 'oldest-added';
    return 'recent-updated';
  }
  function sortUsesAdded(){
    return currentSort === 'oldest-added' || currentSort === 'newest-added';
  }
  function timestampForLeadSort(lead){
    return sortUsesAdded()
      ? lead.created_at

  function fmtTodayOrFull(iso){
    // If from today → "9:14 AM"; else "Jun 11 · 9:14 AM"
    if(!iso) return '';
    const d = new Date(iso);
    if(isNaN(d.getTime())) return '';
    const now = new Date();
    const sameDay =
      d.getFullYear() === now.getFullYear() &&
      d.getMonth() === now.getMonth() &&
      d.getDate() === now.getDate();
    let h = d.getHours();
    const m = d.getMinutes();
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    const time = h + ':' + String(m).padStart(2, '0') + ' ' + ampm;
    if(sameDay) return time;
    return MONTHS_FULL[d.getMonth()] + ' ' + d.getDate() + ' · ' + time;
  }

  function renderNotePromptInnerHtml(){
    // Per change #2 (this round): notes are required across the app.
    //   - 'change' (status change): no Skip button, Save disabled until text
    //   - 'note-edit': Cancel button stays, Save disabled until text
    //   - 'create': no longer reached — initial note is now captured in the
    //     Add Lead form itself
    let headerText;
    if(pendingNote.kind === 'create') headerText = 'Add a note for the initial status';
    else if(pendingNote.kind === 'note-edit') headerText = 'Edit note';
    else headerText = 'Add a note for the status change';

    let sub = pendingNote.leadName || '';
    if(pendingNote.kind === 'change'){
      sub += ' · ' + pendingNote.oldStatus + ' → ' + pendingNote.newStatus;
    } else if(pendingNote.kind === 'note-edit'){
      sub += ' · status ' + pendingNote.statusLabel;
    } else if(pendingNote.statusLabel){
      sub += ' · ' + pendingNote.statusLabel;
    }

    const isEdit = pendingNote.kind === 'note-edit';
    const initialValue = isEdit ? (pendingNote.currentNote || '') : '';
    // Save starts enabled only if the note-edit textarea is pre-filled with
    // non-whitespace text; otherwise it's disabled until the user types.
    const initiallyValid = /\S/.test(initialValue);

    const cancelBtnHtml = isEdit
      ? '<button type="button" class="supabase-btn supabase-btn-secondary" id="note-prompt-skip">Cancel</button>'
      : '';

    return '<div class="supabase-section-label">' + escapeHtml(headerText) + '</div>' +
      '<div class="outreach-overlay-sub">' + escapeHtml(sub) + '</div>' +
