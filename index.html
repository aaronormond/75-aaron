    }
    if(ddId === 'add-lead-status'){
      const selected = newLeadStatus || (statuses[0] && statuses[0].label) || '';
      return '<div class="outreach-cdrop-menu">' +
        statuses.map(function(s){
          const c = s.color || '#4D89FF';
          const isSel = s.label === selected;
          return '<button type="button" class="outreach-cdrop-option' + (isSel ? ' selected' : '') + '" ' +
            'data-action="new-lead-status-select" data-value="' + escapeHtml(s.label) + '">' +
            dotSvg(c) + '<span class="outreach-cdrop-option-label">' + escapeHtml(s.label) + '</span>' +
          '</button>';
        }).join('') +

    }
    if(ddId && ddId.indexOf('lead-') === 0){
      const leadId = ddId.slice(5);
      const lead = leads.find(function(l){ return l.id === leadId; });
      if(!lead) return '';
      // Part 2 revert: replaces single status. All statuses shown, current
      // one highlighted.
      return '<div class="outreach-cdrop-menu">' +
        statuses.map(function(s){
          const c = s.color || '#4D89FF';
          const isSel = s.label === lead.status;
          return '<button type="button" class="outreach-cdrop-option' + (isSel ? ' selected' : '') + '" ' +

            dotSvg(c) + '<span class="outreach-cdrop-option-label">' + escapeHtml(s.label) + '</span>' +

  // Bind-once helper: marks the element so subsequent attachTrackerListeners()
  // calls (e.g. after an overlay-only re-render) don't double-bind elements
  // whose DOM was NOT replaced (toolbar, row). New elements created by an
  // overlay swap have no marker and get bound normally.
  function _bind(el, type, fn){
    if(!el) return;
    const k = '_b_' + type;
    if(el[k]) return;
    el[k] = 1;
    el.addEventListener(type, fn);
  }
  // Replace the overlay's HTML in place — no flash — then re-bind listeners.
  // attachTrackerListeners is idempotent via the `_bind` marker, so calling
  // it again only binds the freshly-rendered overlay elements.
  function updateOverlayInPlace(){
    const overlayRoot = document.getElementById('outreach-overlay-root');
    if(!overlayRoot){ render(); return; }
    overlayRoot.innerHTML = renderOverlayHtml();
    attachTrackerListeners();
    // Restore focus on the note-prompt textarea if active.
    if(pendingNote && pendingNote.stage === 'note'){
      const promptInput = document.getElementById('note-prompt-input');
      if(promptInput){
        promptInput.focus();
        const len = promptInput.value.length;
        try { promptInput.setSelectionRange(len, len); } catch(_){}
      }
    }
  }

  // Sync every `.outreach-cdrop` in the DOM with `openDropdownId`. Only the
  // affected dropdown's children are touched — the surrounding row / overlay /
  // tracker frame is left untouched, so no flash.
  function applyDropdownStateInPlace(){
    document.querySelectorAll('.outreach-cdrop').forEach(function(cdrop){
      const ddId = cdrop.dataset.dropdownId;
      const shouldOpen = openDropdownId === ddId;
      const isOpen = cdrop.classList.contains('open');
      if(shouldOpen && !isOpen){
        cdrop.classList.add('open');
        const menuHtml = buildMenuHtmlForDropdown(ddId);
        if(menuHtml){
          cdrop.insertAdjacentHTML('beforeend', menuHtml);
          const menu = cdrop.querySelector('.outreach-cdrop-menu');
          if(menu) menu.addEventListener('click', handleDynamicMenuClick);
        }
      } else if(!shouldOpen && isOpen){
        cdrop.classList.remove('open');
        const menu = cdrop.querySelector('.outreach-cdrop-menu');
        if(menu) menu.remove();
      }
    });
  }

  function handleDynamicMenuClick(e){
    const opt = e.target.closest('[data-action]');
    if(!opt) return;
    if(opt.dataset.action === 'dropdown-toggle') return;
    e.stopPropagation();
    const action = opt.dataset.action;
    if(action === 'filter-select'){
      currentFilter = opt.dataset.value;
      openDropdownId = null;
      render();
    } else if(action === 'platform-filter-select'){
      currentPlatformFilter = opt.dataset.value;
      openDropdownId = null;
      render();
    } else if(action === 'loom-filter-select'){
      currentLoomFilter = opt.dataset.value;
      openDropdownId = null;
      render();
    } else if(action === 'sort-select'){
      currentSort = opt.dataset.value;
      openDropdownId = null;
      render();
    } else if(action === 'status-select'){
      const leadId = opt.dataset.leadId;
      const newStatus = opt.dataset.value;
      const lead = leads.find(function(l){ return l.id === leadId; });
      openDropdownId = null;
      if(!lead || newStatus === lead.status){ applyDropdownStateInPlace(); return; }
      pendingNote = {
        kind: 'change',
        stage: 'note',
        leadId: lead.id,
        leadName: lead.display_name || primaryUsernameOf(lead) || 'Lead',
        oldStatus: lead.status,
        newStatus: newStatus
      };
      // Combined overlay — open in place so the table doesn't flash and the
      // dropdown's close animation lands without re-painting the row.
      applyDropdownStateInPlace();
      updateOverlayInPlace();
    } else if(action === 'new-lead-status-select'){
      newLeadStatus = opt.dataset.value;
      openDropdownId = null;
      updateAddLeadTriggerInPlace();
      applyDropdownStateInPlace();
    }
  }

  // Update the Add Lead status trigger's label + dot color in place (no
  // overlay rebuild).
  function updateAddLeadTriggerInPlace(){
    const cdrop = document.querySelector('.outreach-cdrop[data-dropdown-id="add-lead-status"]');
    if(!cdrop) return;
    const selected = newLeadStatus || (statuses[0] && statuses[0].label) || '';
    const color = selected ? statusColor(selected) : '#9aa2af';
    const labelEl = cdrop.querySelector('.outreach-cdrop-label');
    const dotEl   = cdrop.querySelector('.outreach-cdrop-dot');
    if(labelEl) labelEl.textContent = selected;
    if(dotEl)   dotEl.style.background = color;
  }

  function attachTrackerListeners(){
    // Custom dropdown — toggle open / close in place (no full re-render).
    document.querySelectorAll('[data-action="dropdown-toggle"]').forEach(function(trig){
      _bind(trig, 'click', function(e){
        e.stopPropagation();
        const id = trig.dataset.dropdownId;
        openDropdownId = (openDropdownId === id) ? null : id;
        applyDropdownStateInPlace();
      });
    });
    // Bind the delegated menu click handler on any statically-rendered menus
    // (i.e. dropdowns rendered with isOpen=true via the existing renderers).
    // Dynamically-injected menus bind the same handler in applyDropdownStateInPlace.
    document.querySelectorAll('.outreach-cdrop-menu').forEach(function(menu){
      _bind(menu, 'click', handleDynamicMenuClick);
    });

    // Rating column header — click toggles between rating-desc and rating-asc.
    // If currently on another sort, first click goes to rating-desc.
    document.querySelectorAll('[data-action="cycle-rating-sort"]').forEach(function(btn){
      _bind(btn, 'click', function(e){
        e.stopPropagation();
        if(currentSort === 'rating-desc') currentSort = 'rating-asc';
        else if(currentSort === 'rating-asc') currentSort = 'rating-desc';
        else currentSort = 'rating-desc';
        render();
      });
    });

    const addBtn = document.getElementById('add-lead-btn');
    if(addBtn) _bind(addBtn, 'click', function(){
      showingAddForm = !showingAddForm;
      if(showingAddForm){
        newLeadStatus = (statuses[0] && statuses[0].label) || null;
        newLeadRating = null;
        newLeadPrimaryPlatform = 'instagram';
      } else {
        newLeadStatus = null;
        newLeadRating = null;
        newLeadPrimaryPlatform = 'instagram';
      }
      render();
    });

    // Part 5: persistent banner "Resume" button.
    const resumeBtn = document.getElementById('migration-resume-btn');
    if(resumeBtn) _bind(resumeBtn, 'click', function(){
      migrationDismissed = false;
      maybeStartIncompleteLeadMigration();
      render();
    });

    const toggleStatusBtn = document.getElementById('toggle-status-manager');
    if(toggleStatusBtn) _bind(toggleStatusBtn, 'click', function(){
      showingStatusManager = true;
      editingStatusId = null;
      updateOverlayInPlace();
    });
    // Part 8: Database button opens its own overlay (no flash).
    const toggleDatabaseBtn = document.getElementById('toggle-database-panel');
    if(toggleDatabaseBtn) _bind(toggleDatabaseBtn, 'click', function(){
      showingDatabasePanel = true;
      updateOverlayInPlace();
    });
    const databaseOverlayClose = document.getElementById('database-overlay-close');
    if(databaseOverlayClose) _bind(databaseOverlayClose, 'click', function(){
      showingDatabasePanel = false;
      updateOverlayInPlace();
    });
    document.querySelectorAll('[data-action="overlay-dismiss-database"]').forEach(function(ov){
      _bind(ov, 'click', function(e){
        if(e.target !== ov) return;
        showingDatabasePanel = false;
        updateOverlayInPlace();
      });
    });

    // Toolbar search — filters in real time, preserves input focus + caret
    // position across the re-render that follows each keystroke.
    const searchInput = document.getElementById('outreach-search-input');
    if(searchInput){
      _bind(searchInput, 'input', function(){
        searchQuery = searchInput.value;
        const selStart = searchInput.selectionStart;
        const selEnd   = searchInput.selectionEnd;
        render();
        const newInput = document.getElementById('outreach-search-input');
        if(newInput){
          newInput.focus();
          try { newInput.setSelectionRange(selStart, selEnd); } catch(_){}
        }
      });
    }
    const searchClearBtn = document.getElementById('outreach-search-clear');
    if(searchClearBtn) _bind(searchClearBtn, 'click', function(){
      searchQuery = '';
      render();
      const newInput = document.getElementById('outreach-search-input');
      if(newInput) newInput.focus();
    });

    // Manage Statuses overlay — close via × button or backdrop click (no flash).
    const statusOverlayClose = document.getElementById('status-overlay-close');
    if(statusOverlayClose) _bind(statusOverlayClose, 'click', function(){
      showingStatusManager = false;
      editingStatusId = null;
      updateOverlayInPlace();
    });
    document.querySelectorAll('[data-action="overlay-dismiss-status"]').forEach(function(ov){
      _bind(ov, 'click', function(e){
        if(e.target !== ov) return;
        showingStatusManager = false;
        editingStatusId = null;
        updateOverlayInPlace();
      });
    });
    // Part 7 — status rename: pencil starts edit, ✓ commits, × cancels.
    // Start/cancel just toggle overlay-local state — use in-place update.
    document.querySelectorAll('[data-action="status-rename-start"]').forEach(function(btn){
      _bind(btn, 'click', function(e){
        e.stopPropagation();
        editingStatusId = btn.dataset.statusId;
        updateOverlayInPlace();
        const inp = document.querySelector('input[data-action="status-rename-input"][data-status-id="' + editingStatusId + '"]');
        if(inp){ inp.focus(); inp.select(); }
      });
    });
    document.querySelectorAll('[data-action="status-rename-cancel"]').forEach(function(btn){
      _bind(btn, 'click', function(e){
        e.stopPropagation();
        editingStatusId = null;
        updateOverlayInPlace();
      });
    });
    document.querySelectorAll('[data-action="status-rename-save"]').forEach(function(btn){
      _bind(btn, 'click', async function(e){
        e.stopPropagation();
        const id = btn.dataset.statusId;
        const inp = document.querySelector('input[data-action="status-rename-input"][data-status-id="' + id + '"]');
        const newLabel = inp ? inp.value.trim() : '';
        if(!newLabel) return;
        try {
          await renameStatusById(id, newLabel);
          editingStatusId = null;
          await loadStatuses();
          await loadLeads();
          await loadAllHistories();
          render();
        } catch(err){ alert('Error: ' + errMsg(err)); }
      });
    });
    // Enter commits, Esc cancels inside the rename input.
    document.querySelectorAll('input[data-action="status-rename-input"]').forEach(function(inp){
      _bind(inp, 'keydown', function(e){
        if(e.key === 'Enter'){
          e.preventDefault();
          const id = inp.dataset.statusId;
          const sv = document.querySelector('button[data-action="status-rename-save"][data-status-id="' + id + '"]');
          if(sv) sv.click();
        } else if(e.key === 'Escape'){
          e.preventDefault();
          editingStatusId = null;
          updateOverlayInPlace();
        }
      });
    });

    // Add Lead overlay — close via × button or backdrop click (no flash).
    const addLeadClose = document.getElementById('add-lead-close');
    if(addLeadClose) _bind(addLeadClose, 'click', function(){
      showingAddForm = false;
      newLeadStatus = null;
      newLeadRating = null;
      updateOverlayInPlace();
    });
    document.querySelectorAll('[data-action="overlay-dismiss-add"]').forEach(function(ov){
      _bind(ov, 'click', function(e){
        if(e.target !== ov) return;
        showingAddForm = false;
        newLeadStatus = null;
        newLeadRating = null;
        updateOverlayInPlace();
      });
    });

    // Add Lead status dropdown options are bound via the delegated
    // handleDynamicMenuClick handler (no static binding needed).

    // Part 4: Add Lead form — read + validate the new field set.
    function readAddLeadFields(){
      const dn = document.getElementById('lead-display-name');
      const ig = document.getElementById('lead-instagram');
      const yt = document.getElementById('lead-youtube');
      const lm = document.getElementById('lead-loom');
      const nt = document.getElementById('lead-note');
      return {
        display_name: dn ? dn.value.trim() : '',
        instagram:    ig ? ig.value.trim().replace(/^@+/, '') : '',
        youtube:      yt ? yt.value.trim().replace(/^@+/, '') : '',
        loom_url:     lm ? lm.value.trim() : '',
        status:       newLeadStatus || '',
        rating:       newLeadRating,
        notes:        nt ? nt.value.trim() : '',
        primary_platform: newLeadPrimaryPlatform
      };
    }
    function isAddLeadValid(){
      const f = readAddLeadFields();
      const hasOnePlatform = !!f.instagram || !!f.youtube;
      return hasOnePlatform && !!f.status &&
        (f.rating === 1 || f.rating === 2 || f.rating === 3) &&
        !!f.notes;
    }
    function updateAddLeadFormStateInPlace(){
      const btn = document.getElementById('form-save');
      if(btn) btn.disabled = !isAddLeadValid();
      // Reveal the primary-platform toggle only when BOTH fields are filled.
      const f = readAddLeadFields();
      const toggle = document.getElementById('new-lead-primary-toggle');
      if(toggle) toggle.hidden = !(f.instagram && f.youtube);
      // Hide the platform-hint once at least one is filled.
      const hint = document.getElementById('new-lead-platform-hint');
      if(hint) hint.hidden = !!(f.instagram || f.youtube);
    }
    function markAddLeadInvalidFields(){
      const f = readAddLeadFields();
      const ig = document.getElementById('lead-instagram');
      const yt = document.getElementById('lead-youtube');
      const nt = document.getElementById('lead-note');
      const rt = document.getElementById('new-lead-rating');
      const hasOnePlatform = !!f.instagram || !!f.youtube;
      if(ig) ig.classList.toggle('invalid', !hasOnePlatform);
      if(yt) yt.classList.toggle('invalid', !hasOnePlatform);
      if(nt) nt.classList.toggle('invalid', !f.notes);
      if(rt) rt.classList.toggle('invalid', !(f.rating === 1 || f.rating === 2 || f.rating === 3));
    }
    ['lead-display-name','lead-instagram','lead-youtube','lead-loom','lead-note'].forEach(function(id){
      const el = document.getElementById(id);
      if(!el) return;
      _bind(el, 'input', function(){
        if(el.value.trim()) el.classList.remove('invalid');
        updateAddLeadFormStateInPlace();
      });
      // Part 3: Enter (no Shift) submits the form. Shift+Enter inserts a
      // newline in the notes textarea; on single-line inputs Enter just submits.
      _bind(el, 'keydown', function(e){
        if(e.key !== 'Enter') return;
        if(e.shiftKey) return; // allow newline in textarea
        e.preventDefault();
        const sb = document.getElementById('form-save');
        if(sb && !sb.disabled) sb.click();
      });
    });
    // Primary platform toggle inside the Add Lead form.
    document.querySelectorAll('[data-action="new-lead-primary"]').forEach(function(btn){
      _bind(btn, 'click', function(e){
        e.preventDefault(); e.stopPropagation();
        newLeadPrimaryPlatform = btn.dataset.value;
        const wrap = document.getElementById('new-lead-primary-toggle');
        if(wrap){
          wrap.querySelectorAll('.outreach-primary-toggle-btn').forEach(function(b){
            b.classList.toggle('active', b.dataset.value === newLeadPrimaryPlatform);
          });
        }
      });
    });
    // Star handler for the Add Lead form rating field.
    document.querySelectorAll('[data-action="rate-new-lead"]').forEach(function(starBtn){
      _bind(starBtn, 'click', function(e){
        e.stopPropagation();
        e.preventDefault();
        const clicked = parseInt(starBtn.dataset.rating, 10) || 0;
        newLeadRating = (newLeadRating === clicked) ? null : clicked;
        const wrap = document.getElementById('new-lead-rating');
        if(wrap){
          wrap.querySelectorAll('.outreach-star').forEach(function(b){
            const idx = parseInt(b.dataset.rating, 10);
            if(newLeadRating != null && idx <= newLeadRating) b.classList.add('filled');
            else b.classList.remove('filled');
          });
          if(newLeadRating != null) wrap.classList.remove('invalid');
        }
        updateAddLeadFormStateInPlace();
      });
    });
    // Sync the toggle/hint visibility on initial render.
    if(showingAddForm) updateAddLeadFormStateInPlace();

    const saveBtn = document.getElementById('form-save');
    if(saveBtn) _bind(saveBtn, 'click', async function(){
      if(!isAddLeadValid()){
        markAddLeadInvalidFields();
        return;
      }
      const f = readAddLeadFields();
      // Resolve primary_platform: if both filled, use newLeadPrimaryPlatform;
      // otherwise default to whichever is provided.
      let primary;
      if(f.instagram && f.youtube) primary = newLeadPrimaryPlatform || 'instagram';
      else if(f.instagram) primary = 'instagram';
      else primary = 'youtube';
      saveBtn.disabled = true;
      try {
        await createLead({
          display_name: f.display_name,
          instagram:    f.instagram || null,
          youtube:      f.youtube || null,
          loom_url:     f.loom_url || null,
          primary_platform: primary,
          status:       f.status,
          rating:       f.rating,
          notes:        f.notes
        });
        showingAddForm = false;
        newLeadStatus = null;
        newLeadRating = null;
        newLeadPrimaryPlatform = 'instagram';
        await loadLeads();
        await loadAllHistories();
        await loadAllNotes();
        render();
      } catch(e){
        alert('Error: ' + errMsg(e));
        saveBtn.disabled = false;
      }
    });
    const cancelBtn = document.getElementById('form-cancel');
    if(cancelBtn) _bind(cancelBtn, 'click', function(){
      showingAddForm = false;
      newLeadStatus = null;
      newLeadRating = null;
      newLeadPrimaryPlatform = 'instagram';
      updateOverlayInPlace();
    });

    // Part 9: Edit Lead overlay — wire close/save/cancel/primary-toggle.
    function syncEditLeadInPlace(){
      const ig = document.getElementById('edit-lead-instagram');
      const yt = document.getElementById('edit-lead-youtube');
      const toggle = document.getElementById('edit-lead-primary-toggle');
      const hint = document.getElementById('edit-lead-platform-hint');
      const igVal = ig ? ig.value.trim().replace(/^@+/, '') : '';
      const ytVal = yt ? yt.value.trim().replace(/^@+/, '') : '';
      if(toggle) toggle.hidden = !(igVal && ytVal);
      if(hint) hint.hidden = !!(igVal || ytVal);
    }
    ['edit-lead-display-name','edit-lead-instagram','edit-lead-youtube','edit-lead-loom'].forEach(function(id){
      const el = document.getElementById(id);
      if(!el) return;
      _bind(el, 'input', function(){
        if(el.value.trim()) el.classList.remove('invalid');
        syncEditLeadInPlace();
      });
    });
    // Initial sync — show toggle if both pre-filled.
    if(editingLeadOverlayId) syncEditLeadInPlace();
    // Edit primary platform toggle — in-place class swap.
    document.querySelectorAll('[data-action="edit-lead-primary"]').forEach(function(btn){
      _bind(btn, 'click', function(e){
        e.preventDefault(); e.stopPropagation();
        const wrap = document.getElementById('edit-lead-primary-toggle');
        if(wrap){
          wrap.querySelectorAll('.outreach-primary-toggle-btn').forEach(function(b){
            b.classList.toggle('active', b === btn);
          });
        }
      });
    });
    const editLeadCloseBtn = document.getElementById('edit-lead-close');
    if(editLeadCloseBtn) _bind(editLeadCloseBtn, 'click', closeEditLeadOverlay);
    const editLeadCancelBtn = document.getElementById('edit-lead-cancel');
    if(editLeadCancelBtn) _bind(editLeadCancelBtn, 'click', closeEditLeadOverlay);
    document.querySelectorAll('[data-action="overlay-dismiss-edit"]').forEach(function(ov){
      _bind(ov, 'click', function(e){
        if(e.target !== ov) return;
        closeEditLeadOverlay();
      });
    });
    const editLeadSaveBtn = document.getElementById('edit-lead-save');
    if(editLeadSaveBtn) _bind(editLeadSaveBtn, 'click', async function(){
      const lead = leads.find(function(l){ return l.id === editingLeadOverlayId; });
      if(!lead) return;
      const dn = document.getElementById('edit-lead-display-name');
      const ig = document.getElementById('edit-lead-instagram');
      const yt = document.getElementById('edit-lead-youtube');
      const lm = document.getElementById('edit-lead-loom');
      const display_name = dn ? dn.value.trim() : '';
      const instagram    = ig ? ig.value.trim().replace(/^@+/, '') : '';
      const youtube      = yt ? yt.value.trim().replace(/^@+/, '') : '';
      const loom_url     = lm ? lm.value.trim() : '';
      if(!instagram && !youtube){
        if(ig) ig.classList.add('invalid');
        if(yt) yt.classList.add('invalid');
        const hint = document.getElementById('edit-lead-platform-hint');
        if(hint) hint.hidden = false;
        return;
      }
      // Resolve primary: read which toggle is .active, default to existing
      // primary or the only-provided platform.
      let primary = lead.primary_platform || null;
      if(instagram && youtube){
        const wrap = document.getElementById('edit-lead-primary-toggle');
        const active = wrap ? wrap.querySelector('.outreach-primary-toggle-btn.active') : null;
        primary = (active && active.dataset.value) || primary || 'instagram';
      } else if(instagram){
        primary = 'instagram';
      } else {
        primary = 'youtube';
      }
      editLeadSaveBtn.disabled = true;
      try {
        await updateLeadFields(lead.id, {
          display_name: display_name || null,
          instagram: instagram || null,
          youtube: youtube || null,
          loom_url: loom_url || null,
          primary_platform: primary
        });
        const wasMigration = (migrationLeadId === lead.id);
        editingLeadOverlayId = null;
        migrationLeadId = null;
        await loadLeads();
        // Continue the migration queue if still in auto-flow.
        if(wasMigration && !migrationDismissed){
          maybeStartIncompleteLeadMigration();
        }
        render();
      } catch(e){
        alert('Error: ' + errMsg(e));
        editLeadSaveBtn.disabled = false;
      }
    });
    function closeEditLeadOverlay(){
      const wasMigration = (migrationLeadId === editingLeadOverlayId);
      editingLeadOverlayId = null;
      if(wasMigration){
        // User dismissed mid-flow → stop auto-flow, show banner. The banner
        // sits in the tracker frame so a full render is needed to show it.
        migrationDismissed = true;
        migrationLeadId = null;
        render();
      } else {
        updateOverlayInPlace();
      }
    }

    // Overlay — note prompt Save (always required) + Cancel (note-edit/
    // add-note only). Enter submits, Shift+Enter inserts newline (Part 3).
    const noteInput = document.getElementById('note-prompt-input');
    const noteSaveBtn = document.getElementById('note-prompt-save');
    if(noteInput && noteSaveBtn){
      const sync = function(){
        const v = noteInput.value || '';
        const valid = /\S/.test(v);
        noteSaveBtn.disabled = !valid;
        if(valid) noteInput.classList.remove('invalid');
      };
      _bind(noteInput, 'input', sync);
      _bind(noteInput, 'keydown', function(e){
        if(e.key === 'Enter' && !e.shiftKey){
          e.preventDefault();
          if(!noteSaveBtn.disabled) noteSaveBtn.click();
        }
      });
    }
    if(noteSaveBtn) _bind(noteSaveBtn, 'click', async function(){
      const input = document.getElementById('note-prompt-input');
      const note = input ? input.value.trim() : '';
      if(!note){
        if(input) input.classList.add('invalid');
        return;
      }
      await commitPendingNote(note);
    });
    // Cancel is only rendered for note-edit / add-note / change kinds (no flash).
    const noteSkipBtn = document.getElementById('note-prompt-skip');
    if(noteSkipBtn) _bind(noteSkipBtn, 'click', function(){
      pendingNote = null;
      updateOverlayInPlace();
    });

    // Part 5/6: custom delete-confirmation overlay handlers (no flash on cancel).
    const confirmDeleteCancelBtn = document.getElementById('confirm-delete-cancel');
    if(confirmDeleteCancelBtn) _bind(confirmDeleteCancelBtn, 'click', function(){
      pendingConfirm = null;
      updateOverlayInPlace();
    });
    document.querySelectorAll('[data-action="overlay-dismiss-confirm"]').forEach(function(ov){
      _bind(ov, 'click', function(e){
        if(e.target !== ov) return;
        pendingConfirm = null;
        updateOverlayInPlace();
      });
    });
    const confirmDeleteYesBtn = document.getElementById('confirm-delete-yes');
    if(confirmDeleteYesBtn) _bind(confirmDeleteYesBtn, 'click', async function(){
      const pc = pendingConfirm;
      pendingConfirm = null;
      // Close the confirm overlay in place; onConfirm will trigger a full
      // render itself once data changes land.
      updateOverlayInPlace();
      if(pc && typeof pc.onConfirm === 'function'){
        try { await pc.onConfirm(); }
        catch(err){ alert('Error: ' + errMsg(err)); }
      }
    });

    document.querySelectorAll('.outreach-row').forEach(function(row){
      const id = row.dataset.leadId;
      const lead = leads.find(function(l){ return l.id === id; });
      if(!lead) return;

      _bind(row, 'click', function(e){
        if(e.target.closest('[data-action]')) return;
        if(e.target.closest('[data-noexpand]')) return;
        if(e.target.closest('a')) return;
        if(e.target.closest('input, textarea, select, button')) return;
        if(row.classList.contains('outreach-row-expanded')){
          expandedLeadId = null;
          render();
        } else {
          expandedLeadId = id;
          render();
        }
      });

      row.querySelectorAll('[data-action]').forEach(function(btn){
        _bind(btn, 'click', async function(e){
          e.stopPropagation();
          const action = btn.dataset.action;
          if(action === 'copy-url'){
            const url = btn.dataset.url || '';
            try {
              await navigator.clipboard.writeText(url);
              const orig = btn.innerHTML;
              btn.classList.add('copied');
              btn.innerHTML = '<span class="outreach-copy-check">✓</span>';
              setTimeout(function(){
                btn.classList.remove('copied');
                btn.innerHTML = orig;
              }, 1200);
            } catch(_){}
          } else if(action === 'rate-lead'){
            const clicked = parseInt(btn.dataset.rating, 10) || 0;
            const target = (lead.rating === clicked) ? null : clicked;
            lead.rating = target;
            const ratingWrap = row.querySelector('.outreach-rating');
            if(ratingWrap){
              ratingWrap.querySelectorAll('.outreach-star').forEach(function(starBtn){
                const idx = parseInt(starBtn.dataset.rating, 10);
                if(target != null && idx <= target) starBtn.classList.add('filled');
                else starBtn.classList.remove('filled');
              });
            }
            try {
              await updateLeadRating(lead.id, target);
            } catch(err){
              alert('Error: ' + errMsg(err));
              await loadLeads(); render();
            }
          } else if(action === 'collapse'){
            expandedLeadId = null; render();
          } else if(action === 'edit-lead-overlay'){
            // Part 9: open the standalone edit lead overlay (no flash).
            editingLeadOverlayId = id;
            updateOverlayInPlace();
          } else if(action === 'delete'){
            // Part 6: custom delete confirmation (no flash on open).
            const displayName = lead.display_name || primaryUsernameOf(lead) || 'this lead';
            pendingConfirm = {
              title: 'delete lead?',
              sub: 'Delete lead ' + displayName + '? This cannot be undone.',
              confirmLabel: 'Delete',
              onConfirm: async function(){
                await deleteLead(id);
                expandedLeadId = null;
                await loadLeads();
                await loadAllHistories();
                await loadAllNotes();
                await loadAllNoteEdits();
                render();
              }
            };
            updateOverlayInPlace();
          } else if(action === 'delete-note'){
            // Part 4: × on a note row — silently remove. No activity log entry.
            const noteId = btn.dataset.noteId;
            pendingConfirm = {
              title: 'delete note?',
              sub: 'This note will be permanently removed.',
              confirmLabel: 'Delete',
              onConfirm: async function(){
                const del = await supabaseClient.from('outreach_notes').delete().eq('id', noteId);
                if(del.error) throw del.error;
                await loadAllNotes();
                await loadAllNoteEdits();
                render();
              }
            };
            updateOverlayInPlace();
          } else if(action === 'delete-note-edit'){
            // Part 4: × on a note edit — revert text to previous_text, delete edit row.
            const editId = btn.dataset.editId;
            const noteId = btn.dataset.noteId;
            // Locate the previous_text on the edit being reverted.
            let prevText = '';
            const arr = editsByNoteId.get(noteId) || [];
            for(const e of arr){
              if(e.id === editId){ prevText = e.previous_text || ''; break; }
            }
            pendingConfirm = {
              title: 'revert edit?',
              sub: 'The note will be restored to its previous text.',
              confirmLabel: 'Revert',
              onConfirm: async function(){
                const upd = await supabaseClient.from('outreach_notes')
                  .update({ note_text: prevText })
                  .eq('id', noteId);
                if(upd.error) throw upd.error;
                const del = await supabaseClient.from('outreach_note_edits')
                  .delete().eq('id', editId);
                if(del.error) throw del.error;
                await loadAllNotes();
                await loadAllNoteEdits();
                render();
              }
            };
            updateOverlayInPlace();
          } else if(action === 'delete-block'){
            // Part 4: × on the latest status block — silently remove the
            // history row + cascaded notes/edits. Block if it's the only one.
            const histId = btn.dataset.historyId;
            const histList = leadHistories.get(id) || [];
            if(histList.length <= 1){
              alert('Cannot delete — this would leave the lead with no history.');
              return;
            }
            pendingConfirm = {
              title: 'remove most recent status change?',
              sub: 'The status block and any of its notes will be permanently removed.',
              confirmLabel: 'Remove',
              onConfirm: async function(){
                const del = await supabaseClient.from('outreach_status_history')
                  .delete().eq('id', histId);
                if(del.error) throw del.error;
                // Sync the lead's `status` column back to whatever the new
                // most-recent block says.
                const r = await supabaseClient.from('outreach_status_history')
                  .select('id, new_status, changed_at')
                  .eq('lead_id', id)
                  .order('changed_at', { ascending: false })
                  .limit(1);
                if(r.error) throw r.error;
                if(r.data && r.data.length){
                  const upd = await supabaseClient.from('outreach_leads')
                    .update({ status: r.data[0].new_status })
                    .eq('id', id);
                  if(upd.error) throw upd.error;
                }
                await loadLeads();
                await loadAllHistories();
                await loadAllNotes();
                await loadAllNoteEdits();
                render();
              }
            };
            updateOverlayInPlace();
          } else if(action === 'add-note-to-block'){
            // Part 8: + button on a block opens the note prompt; saving
            // appends a note row to that history row's block (no flash).
            const histId = btn.dataset.historyId;
            const histList = leadHistories.get(id) || [];
            const histRow = histList.find(function(h){ return h.id === histId; });
            pendingNote = {
              kind: 'add-note',
              stage: 'note',
              leadId: id,
              leadName: lead.display_name || primaryUsernameOf(lead) || 'Lead',
              historyId: histId,
              statusLabel: histRow ? histRow.new_status : ''
            };
            updateOverlayInPlace();
          } else if(action === 'edit-note'){
            // Part 8: ✏️ on the most-recent note of the most-recent block.
            const noteId = btn.dataset.noteId;
            // Find the note + its parent history row for the prompt sub-line.
            let foundNote = null;
            let parentHist = null;
            notesByHistoryId.forEach(function(arr, hId){
              if(foundNote) return;
              for(const n of arr){
                if(n.id === noteId){
                  foundNote = n;
                  const hl = leadHistories.get(id) || [];
                  parentHist = hl.find(function(h){ return h.id === hId; });
                  break;
                }
              }
            });
            if(!foundNote) return;
            const edits = editsByNoteId.get(noteId) || [];
            const currentNote = edits.length
              ? (edits[edits.length - 1].new_text || '')
              : (foundNote.note_text || '');
            pendingNote = {
              kind: 'note-edit',
              stage: 'note',
              leadId: id,
              leadName: lead.display_name || primaryUsernameOf(lead) || 'Lead',
              noteId: noteId,
              statusLabel: parentHist ? parentHist.new_status : '',
              currentNote: currentNote
            };
            updateOverlayInPlace();
          }
        });
      });
    });

    const addStatusBtn = document.getElementById('add-status-btn');
    if(addStatusBtn) _bind(addStatusBtn, 'click', async function(){
      const label = document.getElementById('new-status-label').value.trim();
      const color = document.getElementById('new-status-color').value;
      if(!label) return;
      try {
        await createStatus({ label: label, color: color });
        await loadStatuses();
        render();
      } catch(e){ alert('Error: ' + errMsg(e)); }
    });

    document.querySelectorAll('.outreach-status-delete').forEach(function(btn){
      _bind(btn, 'click', function(){
        if(btn.disabled) return;
        const id = btn.dataset.statusId;
        const status = statuses.find(function(s){ return s.id === id; });
        if(!status) return;
        pendingConfirm = {
          title: 'delete status?',
          sub: 'Delete status "' + status.label + '"?',
          confirmLabel: 'Delete',
          onConfirm: async function(){
            await deleteStatusById(id);
            await loadStatuses();
            render();
          }
        };
        // Open the confirm overlay without rebuilding the tracker.
        updateOverlayInPlace();
      });
    });

    const disconnectBtn = document.getElementById('disconnect-btn');
    if(disconnectBtn) _bind(disconnectBtn, 'click', function(){
      pendingConfirm = {
        title: 'disconnect?',
        sub: 'Disconnect from Supabase? You can reconnect anytime.',
        confirmLabel: 'Disconnect',
        onConfirm: async function(){
          clearCreds();
          supabaseClient = null;
          leads = []; statuses = []; leadHistories.clear();
          notesByHistoryId.clear(); editsByNoteId.clear();
          expandedLeadId = null; editingLeadOverlayId = null;
          showingAddForm = false; showingStatusManager = false;
          showingDatabasePanel = false; editingStatusId = null;
          migrationLeadId = null; migrationDismissed = false;
          phase = 'no-creds';
          render();
        }
      };
      // Open the confirm overlay without rebuilding the tracker.
      updateOverlayInPlace();
    });
  }

  // GLOBAL — close any open custom dropdown when a click lands outside it.
  // Per change #1/#2 (this round): close in place so the surrounding row /
  // overlay doesn't flash.
  document.addEventListener('click', function(e){
    if(!openDropdownId) return;
    if(e.target.closest('.outreach-cdrop[data-dropdown-id="' + openDropdownId + '"]')) return;
    openDropdownId = null;
    if(phase === 'ready') applyDropdownStateInPlace();
  });

  // BOOT
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
